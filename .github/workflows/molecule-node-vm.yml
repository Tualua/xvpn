---
name: molecule-node-vm

"on":
  pull_request:
    branches: [main]
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # VM sizes in MiB, read by extensions/molecule/node-vm/molecule.yml and by the Memory budget step.
  XVPN_NODE_VM_PANEL_MEMORY: "4096"
  XVPN_NODE_VM_NODE_MEMORY: "2048"

jobs:
  node-vm:
    # ubuntu-24.04 standard runner of this public repository: 4 vCPU / 16 GiB RAM (Plan 03-06 assumptions).
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: [alma10, rocky10, oracle10]
        include:
          # Box values copied from extensions/molecule/vm/molecule.yml (T-01-19, T-03-SC).
          - platform: alma10
            box: almalinux/10
            box_version: 10.2.20260914
            box_url: ""
            box_sha256: ""
          - platform: rocky10
            box: rocky10-libvirt-10.3-20261112.0
            box_version: ""
            box_url: https://dl.rockylinux.org/pub/rocky/10/images/x86_64/Rocky-10-Vagrant-Libvirt-10.3-20261112.0.x86_64.vagrant.libvirt.box
            box_sha256: 491cf68af9e485bdd9317051ccfeb68301e86d04476a15b5cfd065d0bd7159ea
          - platform: oracle10
            box: oraclelinux10-libvirt-10.1.710
            box_version: ""
            box_url: https://yum.oracle.com/boxes/oraclelinux/ol10/OL10U1_x86_64-vagrant-libvirt-b710.box
            box_sha256: 66b15e98537906b1d0f60bcba12a2c47fad25d421760ed1ec8eafd0fbe59a25a
    env:
      XVPN_NODE_VM_BOX: ${{ matrix.box }}
      XVPN_NODE_VM_BOX_VERSION: ${{ matrix.box_version }}
      XVPN_NODE_VM_BOX_URL: ${{ matrix.box_url }}
      XVPN_NODE_VM_BOX_SHA256: ${{ matrix.box_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: KVM gate
        # World-writable /dev/kvm: acceptable only on ephemeral GitHub-hosted runners (T-01-21).
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm || { echo "::error::KVM is not available on this runner"; exit 1; }
      - name: Memory budget
        run: |
          mem_total_kb=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          mem_avail_kb=$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)
          mem_total=$((mem_total_kb / 1024))
          mem_avail=$((mem_avail_kb / 1024))
          echo "MemTotal: ${mem_total} MiB, MemAvailable: ${mem_avail} MiB, nproc: $(nproc)"
          if [ "$XVPN_NODE_VM_PANEL_MEMORY" -lt 3072 ]; then
            echo "::error::XVPN_NODE_VM_PANEL_MEMORY below the 3072 MiB floor"; exit 1
          fi
          if [ "$XVPN_NODE_VM_NODE_MEMORY" -lt 1536 ]; then
            echo "::error::XVPN_NODE_VM_NODE_MEMORY below the 1536 MiB floor"; exit 1
          fi
          required=$((XVPN_NODE_VM_PANEL_MEMORY + XVPN_NODE_VM_NODE_MEMORY + 1024))
          if [ "$mem_avail" -lt "$required" ]; then
            echo "::error::molecule-node-vm needs ${required} MiB for two VMs, the runner has ${mem_avail} MiB available"
            exit 1
          fi
      - name: Install libvirt and Vagrant
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils libvirt-daemon-system libvirt-daemon-driver-qemu \
            libvirt-clients libvirt-dev dnsmasq-base ebtables
          if apt-cache policy vagrant-libvirt | grep -q 'Candidate: [^(]'; then
            sudo apt-get install -y --no-install-recommends vagrant vagrant-libvirt libarchive-tools
          else
            curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg]" \
              "https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
              | sudo tee /etc/apt/sources.list.d/hashicorp.list
            sudo apt-get update
            sudo apt-get install -y vagrant build-essential ruby-dev libxml2-dev libxslt-dev zlib1g-dev
            vagrant plugin install vagrant-libvirt --plugin-version 0.12.2
          fi
          vagrant --version
          vagrant plugin list
          sudo systemctl start libvirtd
          sudo setfacl -m user:$USER:rw /var/run/libvirt/libvirt-sock
      - name: Install tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Link collection and install deps
        run: |
          mkdir -p .ansible/collections/ansible_collections/xvpn
          ln -sfn "$GITHUB_WORKSPACE" .ansible/collections/ansible_collections/xvpn/remnawave
          ansible-galaxy collection install -r requirements.yml -p .ansible/collections
          echo "ANSIBLE_COLLECTIONS_PATH=$GITHUB_WORKSPACE/.ansible/collections" >> "$GITHUB_ENV"
      - name: Molecule
        env:
          ANSIBLE_FORCE_COLOR: "1"
          PY_COLORS: "1"
        run: molecule test -s node-vm
