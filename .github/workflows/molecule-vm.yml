---
name: molecule-vm

"on":
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: [alma10, rocky10]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: KVM gate
        # World-writable /dev/kvm: acceptable only on ephemeral GitHub-hosted runners (T-01-21).
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm || { echo "::error::KVM is not available on this runner"; exit 1; }
      - name: Install libvirt and Vagrant
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils libvirt-daemon-system libvirt-daemon-driver-qemu \
            libvirt-clients libvirt-dev dnsmasq-base ebtables
          if apt-cache policy vagrant-libvirt | grep -q 'Candidate: [^(]'; then
            sudo apt-get install -y --no-install-recommends vagrant vagrant-libvirt libarchive-tools
          else
            curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg]" \
              "https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
              | sudo tee /etc/apt/sources.list.d/hashicorp.list
            sudo apt-get update
            sudo apt-get install -y vagrant build-essential ruby-dev libxml2-dev libxslt-dev zlib1g-dev
            vagrant plugin install vagrant-libvirt --plugin-version 0.12.2
          fi
          vagrant --version
          vagrant plugin list
          sudo systemctl start libvirtd
          sudo setfacl -m user:$USER:rw /var/run/libvirt/libvirt-sock
      - name: Install tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Link collection and install deps
        run: |
          mkdir -p .ansible/collections/ansible_collections/xvpn
          ln -sfn "$GITHUB_WORKSPACE" .ansible/collections/ansible_collections/xvpn/remnawave
          ansible-galaxy collection install -r requirements.yml -p .ansible/collections
          echo "ANSIBLE_COLLECTIONS_PATH=$GITHUB_WORKSPACE/.ansible/collections" >> "$GITHUB_ENV"
      - name: Molecule
        env:
          ANSIBLE_FORCE_COLOR: "1"
          PY_COLORS: "1"
        run: molecule test -s vm --platform-name ${{ matrix.platform }}
