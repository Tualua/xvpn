---
name: molecule-container

"on":
  push:
    paths-ignore:
      - ".planning/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".planning/**"
      - "**.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scenario: [container, preflight, node]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Link collection and install deps
        run: |
          mkdir -p .ansible/collections/ansible_collections/xvpn
          ln -sfn "$GITHUB_WORKSPACE" .ansible/collections/ansible_collections/xvpn/remnawave
          ansible-galaxy collection install -r requirements.yml -p .ansible/collections
          echo "ANSIBLE_COLLECTIONS_PATH=$GITHUB_WORKSPACE/.ansible/collections" >> "$GITHUB_ENV"
      - name: Podman info
        run: podman info
      - name: Molecule
        env:
          ANSIBLE_FORCE_COLOR: "1"
          PY_COLORS: "1"
        run: molecule test -s ${{ matrix.scenario }}
