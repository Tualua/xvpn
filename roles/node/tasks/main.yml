---
# Domains are operator input, not secrets, so they are echoed in the failure messages.
- name: Node | validate the inputs
  block:
    - name: Node | refuse registration without activation
      ansible.builtin.assert:
        that:
          - not (xvpn_node_register | bool and not (xvpn_node_activate | bool))
        fail_msg: >-
          xvpn_node_register is true but xvpn_node_activate is false: the certificate gate needs the running edge, and the
          Reality inbound and host are registered only after it passed (D-15). Set xvpn_node_activate: true, or
          xvpn_node_register: false to render without registering
        quiet: true
      when: xvpn_node_state == 'present'

    - name: Node | validate the node domain
      ansible.builtin.assert:
        that:
          - xvpn_node_domain is regex('^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?[.])+([a-z]{2,63}|xn--[a-z0-9]([a-z0-9-]{0,57}[a-z0-9])?)$')
          - not (xvpn_node_domain is regex('(^|[.])example[.](com|org|net)$'))
        fail_msg: "xvpn_node_domain must be a real lowercase FQDN, got '{{ xvpn_node_domain }}'"
        quiet: true

    - name: Node | validate the node image
      ansible.builtin.assert:
        that:
          - xvpn_node_image is regex('^[a-z0-9./_-]+(:[0-9]+)?/[a-z0-9._/-]+:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$')
          - not (xvpn_node_image is regex(':latest$'))
        fail_msg: "xvpn_node_image must carry an exact tag and not be latest, got '{{ xvpn_node_image }}'"
        quiet: true

    - name: Node | validate the node name
      ansible.builtin.assert:
        that:
          - xvpn_node_name | length >= 3
          - xvpn_node_name | length <= 30
        fail_msg: "xvpn_node_name must be 3..30 characters, got '{{ xvpn_node_name }}'; set xvpn_node_name or xvpn_node_profile_name to a shorter value"
        quiet: true

    - name: Node | validate the profile name
      ansible.builtin.assert:
        that:
          - xvpn_node_profile_name is regex('^[A-Za-z0-9_ -]{2,30}$')
          - xvpn_node_profile_name != 'Default-Profile'
        fail_msg: >-
          xvpn_node_profile_name must be 2..30 characters of [A-Za-z0-9_ -] and not Default-Profile,
          got '{{ xvpn_node_profile_name }}'; set xvpn_node_name or xvpn_node_profile_name to a shorter value
        quiet: true

    - name: Node | validate the inbound tag
      ansible.builtin.assert:
        that:
          - xvpn_node_inbound_tag is regex('^[A-Za-z0-9_.-]{1,64}$')
        fail_msg: "xvpn_node_inbound_tag must match ^[A-Za-z0-9_.-]{1,64}$, got '{{ xvpn_node_inbound_tag }}'"
        quiet: true

    - name: Node | validate the state
      ansible.builtin.assert:
        that:
          - xvpn_node_state in ['present', 'absent']
        fail_msg: "xvpn_node_state must be present or absent, got '{{ xvpn_node_state }}'"
        quiet: true

    - name: Node | validate the Panel host and the node API port
      ansible.builtin.assert:
        that:
          - xvpn_node_api_port | int >= 1024
          - xvpn_node_api_port | int <= 65535
          - not (xvpn_node_register | bool) or xvpn_node_panel_host | length > 0
          - not (xvpn_node_register | bool) or xvpn_node_panel_host in groups['all']
        fail_msg: >-
          xvpn_node_api_port must be 1024..65535 and, with xvpn_node_register, xvpn_node_panel_host must be an inventory host:
          set xvpn_node_panel_host or put exactly one host into group remnawave_panel
        quiet: true

    - name: Node | refuse the decommission until it is implemented
      ansible.builtin.assert:
        that:
          - xvpn_node_state != 'absent'
        fail_msg: "xvpn_node_state is absent: decommission is not implemented yet"
        quiet: true

- name: Node | look up the service user
  ansible.builtin.getent:
    database: passwd
    key: "{{ xvpn_node_user }}"
    fail_key: false

- name: Node | require the service user
  ansible.builtin.assert:
    that:
      - ansible_facts['getent_passwd'][xvpn_node_user] is not none
    fail_msg: "service user {{ xvpn_node_user }} does not exist; run xvpn.remnawave.podman_rootless with {{ xvpn_node_user }} first"
    quiet: true

- name: Node | resolve the Panel sources of the node API rule
  when: xvpn_node_state == 'present'
  block:
    - name: Node | read the Panel address from the inventory
      ansible.builtin.set_fact:
        xvpn_node_panel_src_inv: >-
          {{ (hostvars[xvpn_node_panel_host].xvpn_public_ip | default(''))
             if (xvpn_node_panel_host | length > 0 and xvpn_node_panel_host in hostvars) else '' }}

    # Facts of the Panel host are gathered once and reused by later node hosts of the same play.
    - name: Node | gather the network facts of the Panel host
      ansible.builtin.setup:
        gather_subset: [network]
      delegate_to: "{{ xvpn_node_panel_host }}"
      delegate_facts: true
      when:
        - xvpn_node_panel_sources | length == 0
        - xvpn_node_panel_src_inv | length == 0
        - xvpn_node_register | bool
        - xvpn_node_panel_host | length > 0
        - (hostvars[xvpn_node_panel_host].ansible_facts | default({})).default_ipv4 is not defined

    - name: Node | pick the Panel sources
      ansible.builtin.set_fact:
        xvpn_node_panel_sources_resolved: >-
          {{ xvpn_node_panel_sources if xvpn_node_panel_sources | length > 0
             else ([xvpn_node_panel_src_inv] if xvpn_node_panel_src_inv | length > 0
             else ([((hostvars[xvpn_node_panel_host].ansible_facts | default({})).default_ipv4 | default({})).address | default('')]
                   if (xvpn_node_panel_host | length > 0 and xvpn_node_panel_host in hostvars) else [''])) }}
        xvpn_node_panel_sources_fallback: "{{ xvpn_node_panel_sources | length == 0 and xvpn_node_panel_src_inv | length == 0 }}"

    - name: Node | validate the Panel sources
      ansible.builtin.assert:
        that:
          - xvpn_node_panel_sources_resolved | length > 0
          - >-
            xvpn_node_panel_sources_resolved | select('match', '^([0-9]{1,3}[.]){3}[0-9]{1,3}(/[0-9]{1,2})?$') | list | length
            == xvpn_node_panel_sources_resolved | length
        fail_msg: >-
          xvpn_node_panel_sources must hold the Panel IPv4 address(es) the node API accepts; got {{ xvpn_node_panel_sources_resolved }}
          (IPv4 only in v1; when the Panel is behind NAT its default IPv4 is a private address, so set
          xvpn_node_panel_sources to the address the Panel connects from)
        quiet: true

    - name: Node | note the Panel address taken from the facts
      ansible.builtin.debug:
        msg: >-
          NOTICE: xvpn_node_panel_sources is empty; the node API port is opened for {{ xvpn_node_panel_sources_resolved }}
          (default IPv4 of the Panel host). When the Panel is behind NAT, set xvpn_node_panel_sources to the address the Panel connects from.
      when: xvpn_node_panel_sources_fallback | bool

- name: Node | deploy the node
  ansible.builtin.include_tasks: present.yml
  when: xvpn_node_state == 'present'
