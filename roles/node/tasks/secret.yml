---
# SECRET_KEY of the node (NODE-01, API-02): fetched from the Panel once, only when node.env is missing or the operator
# opts in with xvpn_node_rekey. The module runs on the Panel host and reads the API token there; the token never
# travels to the controller. Two concurrent runs against one node are unsupported (no lock): the worst case is two
# keygen calls, the later env write wins and the next run converges.
- name: Node secret | create the env directory
  ansible.builtin.file:
    path: "{{ xvpn_node_env_dir }}"
    state: directory
    owner: "{{ xvpn_node_user }}"
    group: "{{ xvpn_node_user }}"
    mode: "0700"

- name: Node secret | stat node.env
  ansible.builtin.stat:
    path: "{{ xvpn_node_env_dir }}/node.env"
  register: xvpn_node_env_stat
  check_mode: false

- name: Node secret | decide whether a SECRET_KEY is needed
  ansible.builtin.set_fact:
    xvpn_node_secret_wanted: "{{ xvpn_node_register | bool and (xvpn_node_rekey | bool or not xvpn_node_env_stat.stat.exists) }}"

- name: Node secret | fetch the SECRET_KEY from the Panel
  xvpn.remnawave.remnawave_node_secret:
    api_url: "{{ xvpn_node_panel_api_url }}"
    api_token_file: "{{ xvpn_node_panel_api_token_file }}"
    guard_node_name: "{{ omit if xvpn_node_rekey | bool else xvpn_node_name }}"
  # An empty Panel host (container tier, register false) must not break the templating of a skipped task.
  delegate_to: "{{ xvpn_node_panel_host | default(omit, true) }}"
  register: xvpn_node_secret
  no_log: true
  when: xvpn_node_secret_wanted | bool

- name: Node secret | note whether the Panel already knows the node
  ansible.builtin.set_fact:
    xvpn_node_known_in_panel: "{{ xvpn_node_secret.node_exists | default(false) | bool }}"
  no_log: true
  when: xvpn_node_secret_wanted | bool

- name: Node secret | refuse to replace the key of a node the Panel already knows
  ansible.builtin.fail:
    msg: >-
      node.env is missing on {{ inventory_hostname }} but node {{ xvpn_node_name }} already exists in the Panel:
      restore {{ xvpn_node_env_dir }}/node.env from a backup, or re-run once with -e xvpn_node_rekey=true to issue
      a new node key (remnanode restarts; the Panel keeps the node). Nothing was changed.
  when:
    - xvpn_node_secret_wanted | bool
    - xvpn_node_known_in_panel | bool

- name: Node secret | check the format of the SECRET_KEY payload
  ansible.builtin.set_fact:
    xvpn_node_secret_format_ok: >-
      {{ xvpn_node_secret.secret_key is string
         and xvpn_node_secret.secret_key | length > 0
         and '\n' not in xvpn_node_secret.secret_key
         and '\r' not in xvpn_node_secret.secret_key
         and xvpn_node_secret.secret_key is match('^[A-Za-z0-9+/=_-]+$') }}
  no_log: true
  when:
    - xvpn_node_secret_wanted | bool
    - not (xvpn_node_known_in_panel | bool)

- name: Node secret | refuse a malformed SECRET_KEY
  ansible.builtin.fail:
    msg: >-
      the node key returned by the Panel is not a single base64 line (empty, multi-line or unexpected characters);
      nothing was written; check the Panel version against the pinned 3.4.11
  when:
    - xvpn_node_secret_wanted | bool
    - not (xvpn_node_known_in_panel | bool)
    - not (xvpn_node_secret_format_ok | bool)

- name: Node secret | write node.env
  ansible.builtin.template:
    src: node.env.j2
    dest: "{{ xvpn_node_env_dir }}/node.env"
    owner: "{{ xvpn_node_user }}"
    group: "{{ xvpn_node_user }}"
    mode: "0600"
  register: xvpn_node_env
  diff: false
  no_log: true
  when: xvpn_node_secret_wanted | bool

# NODE_PORT is not a secret and lives apart, so a port change never touches SECRET_KEY.
- name: Node secret | write runtime.env
  ansible.builtin.template:
    src: node-runtime.env.j2
    dest: "{{ xvpn_node_env_dir }}/runtime.env"
    owner: "{{ xvpn_node_user }}"
    group: "{{ xvpn_node_user }}"
    mode: "0600"
  register: xvpn_node_runtime_env
  diff: false
  no_log: true

- name: Node secret | refuse a unit without its key file
  ansible.builtin.fail:
    msg: >-
      node.env is missing on {{ inventory_hostname }} and xvpn_node_register is false: the node key comes only from the
      Panel; set xvpn_node_register: true or restore {{ xvpn_node_env_dir }}/node.env
  when:
    - not (xvpn_node_register | bool)
    - xvpn_node_activate | bool
    - not xvpn_node_env_stat.stat.exists
