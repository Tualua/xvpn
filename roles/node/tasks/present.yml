---
# role_path is resolved here, before the include: inside an include_role vars block it would be the edge role's.
- name: Node | resolve the route template path
  ansible.builtin.set_fact:
    xvpn_node_route_src: "{{ role_path }}/templates/node-selfsteal.yml.j2"

- name: Node | write the self-steal route of the node domain
  ansible.builtin.include_role:
    name: xvpn.remnawave.edge
    tasks_from: route
  vars:
    xvpn_edge_route_name: node-selfsteal
    xvpn_edge_route_src: "{{ xvpn_node_route_src }}"

# STEAL-05: 443 opens only after the certificate of the node domain is proven on loopback.
- name: Node | prove the certificate on the loopback entrypoint
  ansible.builtin.include_tasks: gate.yml
  when: xvpn_node_activate | bool

- name: Node | remember that the gate passed
  ansible.builtin.set_fact:
    xvpn_node_gate_passed: true
  when: xvpn_node_activate | bool

- name: Node | fetch the SECRET_KEY and write the env files
  ansible.builtin.include_tasks: secret.yml

- name: Node | deploy remnanode
  ansible.builtin.include_tasks: service.yml

- name: Node | open the node firewall
  ansible.builtin.include_tasks: firewall.yml

# D-15, STEAL-05: no Panel object of the node (profile, squads, node, host) exists before the loopback certificate passed.
- name: Node | register the node in the Panel
  ansible.builtin.include_tasks: register.yml
  when:
    - xvpn_node_register | bool
    - xvpn_node_gate_passed | default(false) | bool
