---
# Registration of the node in the Panel (API-02, D-01..D-04). Every task runs on the Panel host, which reads the API
# token there; the token and the Reality keys never reach the controller. Included only after the certificate gate.
- name: Node register | create or reconcile the Panel objects of the node
  delegate_to: "{{ xvpn_node_panel_host }}"
  module_defaults:
    group/xvpn.remnawave.remnawave:
      api_url: "{{ xvpn_node_panel_api_url }}"
      api_token_file: "{{ xvpn_node_panel_api_token_file }}"
  block:
    # The recursive combine replaces lists: an override of routing.rules must carry the BLOCK rule, which the module
    # enforces through required_block_cidrs; the managed Reality target and serverNames are enforced the same way.
    - name: Node register | reconcile the config profile
      xvpn.remnawave.remnawave_config_profile:
        name: "{{ xvpn_node_profile_name }}"
        config: >-
          {{ lookup('ansible.builtin.template', 'config-profile.json.j2') | from_json
             | combine(xvpn_node_profile_override, recursive=True) }}
        reality_inbounds:
          - tag: "{{ xvpn_node_inbound_tag }}"
            short_ids: "{{ xvpn_node_short_ids }}"
            short_id_length: "{{ xvpn_node_short_id_length }}"
            target: "{{ xvpn_edge_https_address }}"
            server_names: ["{{ xvpn_node_domain }}"]
        required_block_cidrs: "{{ xvpn_node_blocked_cidrs }}"
      register: xvpn_node_profile

    # Union-only membership: inbounds of other profiles stay, a missing non-default squad is created.
    - name: Node register | put the inbound into the squads
      xvpn.remnawave.remnawave_internal_squad:
        name: "{{ item }}"
        config_profile: "{{ xvpn_node_profile_name }}"
        inbound_tags: ["{{ xvpn_node_inbound_tag }}"]
      loop: "{{ xvpn_node_squads }}"
      register: xvpn_node_squad_results

    # Fails with diagnostics when the Panel does not see the node connected within retries x delay.
    - name: Node register | register the node and wait until it is connected
      xvpn.remnawave.remnawave_node:
        name: "{{ xvpn_node_name }}"
        address: "{{ xvpn_node_address }}"
        port: "{{ xvpn_node_api_port }}"
        country_code: "{{ xvpn_node_country_code }}"
        config_profile: "{{ xvpn_node_profile_name }}"
        inbound_tags: ["{{ xvpn_node_inbound_tag }}"]
        wait_connected: "{{ not ansible_check_mode }}"
        wait_retries: "{{ xvpn_node_connect_retries }}"
        wait_delay: "{{ xvpn_node_connect_delay }}"
      register: xvpn_node_registration
