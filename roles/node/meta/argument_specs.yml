---
argument_specs:
  main:
    short_description: Remnawave Node with the self-steal route (skeleton; registration and Xray arrive in later plans)
    options:
      xvpn_node_domain:
        description: Public FQDN of the node, lowercase, not an example.* placeholder. One node domain per host.
        type: str
        required: true
      xvpn_node_name:
        description: Name of the node in the Panel, 3..30 characters. Defaults to inventory_hostname.
        type: str
        default: "{{ inventory_hostname }}"
      xvpn_node_address:
        description: Address the Panel uses to reach the node API. Defaults to xvpn_node_domain.
        type: str
        default: "{{ xvpn_node_domain }}"
      xvpn_node_profile_name:
        description: Config profile name, 2..30 characters of [A-Za-z0-9_ -]. Defaults to the sanitized node name.
        type: str
        default: "{{ xvpn_node_name_sanitized }}"
      xvpn_node_inbound_tag:
        description: Inbound tag, [A-Za-z0-9_.-]{1,64}. Defaults to vless-reality-<sanitized node name>.
        type: str
        default: "vless-reality-{{ xvpn_node_tag_sanitized }}"
      xvpn_node_user:
        description: Service user that owns the node container.
        type: str
        default: rw-node
      xvpn_node_home:
        description: Home directory of the node service user.
        type: str
        default: "{{ xvpn_podman_rootless_home_root | default('/var/lib/xvpn') }}/{{ xvpn_node_user }}"
      xvpn_node_image:
        description: Node image with an exact tag, never latest.
        type: str
        default: docker.io/remnawave/node:3.4.6
      xvpn_node_activate:
        description: Start the units; false only renders and validates.
        type: bool
        default: true
      xvpn_node_register:
        description: Register the node in the Panel through the API.
        type: bool
        default: true
      xvpn_node_panel_host:
        description: Inventory host of the Panel that issues the SECRET_KEY. Defaults to the first host of the Panel group.
        type: str
        default: "{{ (groups[xvpn_panel_hosts_group | default('remnawave_panel')] | default([]))[0] | default('') }}"
      xvpn_node_panel_api_url:
        description: Panel API URL as seen from the Panel host.
        type: str
        default: http://127.0.0.1:3000
      xvpn_node_panel_api_token_file:
        description: Path of the Panel API token file on the Panel host.
        type: path
        default: /var/lib/xvpn/rw-panel/secrets/api-token
      xvpn_node_api_port:
        description: Port of the node API (NODE_PORT), 1024..65535.
        type: int
        default: 2222
      xvpn_node_env_dir:
        description: Directory with the 0600 env files of remnanode (node.env with SECRET_KEY, runtime.env).
        type: path
        default: "{{ xvpn_node_home }}/env"
      xvpn_node_rekey:
        description: "Explicit opt-in: issue a new SECRET_KEY on this run; node.env is rewritten and remnanode restarts."
        type: bool
        default: false
      xvpn_node_panel_sources:
        description: IPv4 addresses or CIDRs of the Panel allowed to reach the node API port; empty takes the address of the Panel host (IPv4 only).
        type: list
        elements: str
        default: []
      xvpn_node_cert_gate_retries:
        description: Number of probes of the loopback certificate gate.
        type: int
        default: 60
      xvpn_node_cert_gate_delay:
        description: Seconds between the probes of the certificate gate.
        type: int
        default: 5
      xvpn_node_cert_gate_ca_file:
        description: CA file that verifies the gate certificate; empty uses the system roots with the production ACME CA.
        type: str
        default: ""
      xvpn_node_profile_override:
        description: >-
          Dict merged recursively into the rendered Xray config of the node profile before it is compared with the Panel
          (lists are replaced, not merged). Reality keys cannot be set here, the private-destination BLOCK rule and the
          managed Reality target and serverNames must survive, otherwise the run fails.
        type: dict
        default: {}
      xvpn_node_state:
        description: present, or absent (decommission, not implemented yet).
        type: str
        default: present
        choices: [present, absent]
  gate:
    short_description: Certificate gate of the node domain on the loopback entrypoint (STEAL-05)
    options:
      xvpn_node_domain:
        description: Public FQDN of the node; its certificate must be served on the loopback entrypoint.
        type: str
        required: true
      xvpn_node_cert_gate_retries:
        description: Number of probes of the loopback certificate gate.
        type: int
        default: 60
      xvpn_node_cert_gate_delay:
        description: Seconds between the probes of the certificate gate.
        type: int
        default: 5
      xvpn_node_cert_gate_ca_file:
        description: CA file that verifies the gate certificate; empty uses the system roots with the production ACME CA.
        type: str
        default: ""
