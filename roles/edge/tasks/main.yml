---
- name: Edge | validate the inputs
  ansible.builtin.assert:
    that:
      - xvpn_edge_user is match('^[a-z_][a-z0-9_-]{0,30}$')
      - xvpn_edge_traefik_image is search(':[^/:]+$')
      - not (xvpn_edge_traefik_image is search(':latest$'))
      - xvpn_edge_decoy_image is search(':[^/:]+$')
      - not (xvpn_edge_decoy_image is search(':latest$'))
      - xvpn_edge_acme_ca in ['production', 'staging', 'custom']
      - xvpn_edge_acme_ca != 'custom' or xvpn_edge_acme_ca_server is match('^https://')
      - xvpn_edge_acme_email == '' or xvpn_edge_acme_email is regex('^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+([.][A-Za-z0-9-]+)+\Z')
      - xvpn_edge_http_address is regex('^[0-9A-Za-z.:\[\]-]*:[0-9]{1,5}\Z')
      - (xvpn_edge_http_address.split(':')[-1] | int) <= 65535
      - xvpn_edge_https_address is regex('^[0-9A-Za-z.:\[\]-]*:[0-9]{1,5}\Z')
      - (xvpn_edge_https_address.split(':')[-1] | int) <= 65535
      - xvpn_edge_decoy_port | int >= 1024
      - xvpn_edge_decoy_port | int <= 65535
    fail_msg: >-
      Invalid edge inputs: check xvpn_edge_user, the image tags (exact, not latest), xvpn_edge_acme_ca
      (custom needs an https xvpn_edge_acme_ca_server), xvpn_edge_acme_email, the entrypoint addresses
      (host:port) and xvpn_edge_decoy_port (1024..65535)
    quiet: true

- name: Edge | look up the service user
  ansible.builtin.getent:
    database: passwd
    key: "{{ xvpn_edge_user }}"
  failed_when: false
  register: xvpn_edge_getent

- name: Edge | require the service user
  ansible.builtin.assert:
    that:
      - xvpn_edge_getent.ansible_facts.getent_passwd is defined
      - xvpn_edge_user in xvpn_edge_getent.ansible_facts.getent_passwd
    fail_msg: "service user {{ xvpn_edge_user }} does not exist; run xvpn.remnawave.podman_rootless first"
    quiet: true

- name: Edge | create the Traefik directories
  ansible.builtin.file:
    path: "{{ xvpn_edge_home }}/{{ item }}"
    state: directory
    owner: "{{ xvpn_edge_user }}"
    group: "{{ xvpn_edge_user }}"
    mode: "0700"
  loop:
    - traefik
    - traefik/static
    - traefik/dynamic
    - traefik/acme
    - traefik/ca

- name: Edge | render the Traefik static configuration
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ xvpn_edge_home }}/traefik/static/traefik.yml"
    owner: "{{ xvpn_edge_user }}"
    group: "{{ xvpn_edge_user }}"
    mode: "0600"
  register: xvpn_edge_static

- name: Edge | install the extra trusted CA
  ansible.builtin.copy:
    src: "{{ xvpn_edge_acme_trusted_ca_file }}"
    dest: "{{ xvpn_edge_home }}/traefik/ca/ca.pem"
    remote_src: true
    owner: "{{ xvpn_edge_user }}"
    group: "{{ xvpn_edge_user }}"
    mode: "0600"
  when: xvpn_edge_acme_trusted_ca_file | length > 0
  register: xvpn_edge_ca

- name: Edge | look up the ACME stores
  ansible.builtin.stat:
    path: "{{ xvpn_edge_home }}/traefik/acme/{{ item }}"
  loop:
    - "{{ xvpn_edge_acme_storage_file }}"
    - "{{ xvpn_edge_acme_legacy_file }}"
  register: xvpn_edge_acme_stores

# Traefik creates every ACME store itself with 0600 (one file per CA, 02-UAT-G1). The role never pre-creates,
# slurps, copies or prints a store (T-02-05). The legacy single store of earlier versions is not migrated (its CA is
# unknown without reading it): it stays in place, only its mode is kept private; the active CA re-issues once.
- name: Edge | keep the ACME stores private
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    owner: "{{ xvpn_edge_user }}"
    group: "{{ xvpn_edge_user }}"
    mode: "0600"
  loop: "{{ xvpn_edge_acme_stores.results }}"
  loop_control:
    label: "{{ item.stat.path | default(item.item) }}"
  when: item.stat.exists

# nginx-unprivileged runs as uid 101 inside the user namespace, not as the service user, so the public decoy
# content must be world-readable; Traefik runs as container root (the service user) and keeps 0600/0700.
- name: Edge | create the decoy directories
  ansible.builtin.file:
    path: "{{ xvpn_edge_home }}/{{ item }}"
    state: directory
    owner: "{{ xvpn_edge_user }}"
    group: "{{ xvpn_edge_user }}"
    mode: "0755"
  loop:
    - decoy
    - decoy/site
    - decoy/conf.d

- name: Edge | install the decoy site
  ansible.builtin.copy:
    src: "{{ ((xvpn_edge_decoy_src | length) > 0) | ternary(xvpn_edge_decoy_src ~ '/', role_path ~ '/files/decoy/') }}"
    dest: "{{ xvpn_edge_home }}/decoy/site/"
    owner: "{{ xvpn_edge_user }}"
    group: "{{ xvpn_edge_user }}"
    mode: "0644"
    directory_mode: "0755"

- name: Edge | render the decoy nginx configuration
  ansible.builtin.template:
    src: decoy-nginx.conf.j2
    dest: "{{ xvpn_edge_home }}/decoy/conf.d/default.conf"
    owner: "{{ xvpn_edge_user }}"
    group: "{{ xvpn_edge_user }}"
    mode: "0644"
  register: xvpn_edge_decoy_conf

- name: Edge | publish the shared dynamic configuration through the route entry point
  ansible.builtin.include_tasks: route.yml
  vars:
    xvpn_edge_route_name: 00-edge
    xvpn_edge_route_src: "{{ role_path }}/templates/00-edge.yml.j2"
    xvpn_edge_route_state: present
    xvpn_edge_route_sensitive: false

# role_path is resolved here, before the include: inside an include_role vars block it would be evaluated
# lazily in the context of the included role (podman_rootless).
- name: Edge | build the Quadlet specs
  ansible.builtin.set_fact:
    xvpn_edge_quadlet_specs:
      - template_src: "{{ role_path }}/templates/traefik.container.j2"
      - template_src: "{{ role_path }}/templates/xvpn-decoy.container.j2"

- name: Edge | deploy the Quadlet units
  ansible.builtin.include_role:
    name: xvpn.remnawave.podman_rootless
    tasks_from: quadlet
  vars:
    xvpn_podman_rootless_quadlet_user: "{{ xvpn_edge_user }}"
    xvpn_podman_rootless_quadlet_specs: "{{ xvpn_edge_quadlet_specs }}"
    xvpn_podman_rootless_quadlet_activate: "{{ xvpn_edge_activate }}"

# Traefik reads the static configuration and the extra CA only at start, so a change needs a restart (Pitfall 7).
# The restart also fires for files newer than the running unit, so a run that failed after rendering heals next time.
- name: Edge | restart Traefik after a static configuration change
  ansible.builtin.include_role:
    name: xvpn.remnawave.podman_rootless
    tasks_from: restart_stale
  vars:
    xvpn_podman_rootless_restart_user: "{{ xvpn_edge_user }}"
    xvpn_podman_rootless_restart_unit: traefik.service
    xvpn_podman_rootless_restart_files:
      - "{{ xvpn_edge_home }}/traefik/static/traefik.yml"
      - "{{ xvpn_edge_home }}/traefik/ca/ca.pem"
    xvpn_podman_rootless_restart_changed: "{{ xvpn_edge_static is changed or xvpn_edge_ca is changed }}"
  when: xvpn_edge_activate | bool

- name: Edge | restart the decoy after an nginx configuration change
  ansible.builtin.include_role:
    name: xvpn.remnawave.podman_rootless
    tasks_from: restart_stale
  vars:
    xvpn_podman_rootless_restart_user: "{{ xvpn_edge_user }}"
    xvpn_podman_rootless_restart_unit: xvpn-decoy.service
    xvpn_podman_rootless_restart_files:
      - "{{ xvpn_edge_home }}/decoy/conf.d/default.conf"
    xvpn_podman_rootless_restart_changed: "{{ xvpn_edge_decoy_conf is changed }}"
  when: xvpn_edge_activate | bool
