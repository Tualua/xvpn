---
- name: Common | validate the firewall port entries
  ansible.builtin.assert:
    that:
      - item is match('^[0-9]{1,5}/(tcp|udp)$')
      - (item | regex_replace('/.*$', '') | int) >= 1
      - (item | regex_replace('/.*$', '') | int) <= 65535
    fail_msg: "Invalid firewall port entry '{{ item }}'; expected <1-65535>/<tcp|udp>"
    quiet: true
  loop: "{{ xvpn_common_firewall_ports }}"

- name: Common | validate the public interface name
  ansible.builtin.assert:
    that:
      - (xvpn_public_interface | default('')) is match('^[A-Za-z0-9_.:-]{1,15}$')
    fail_msg: "Invalid xvpn_public_interface '{{ xvpn_public_interface | default('') }}'"
    quiet: true
  when: (xvpn_public_interface | default('')) | length > 0

- name: Common | install the baseline packages
  ansible.builtin.dnf:
    name: "{{ xvpn_common_packages }}"
    state: present

# Defence in depth when the preflight play is skipped; the SELinux mode is never changed.
- name: Common | read the SELinux mode
  ansible.builtin.command: getenforce
  register: xvpn_common_getenforce
  changed_when: false
  check_mode: false
  failed_when: false

- name: Common | require SELinux Enforcing
  ansible.builtin.fail:
    msg: >-
      SELinux must be Enforcing (getenforce: {{ xvpn_common_getenforce.stdout | default('') | trim }});
      this collection never changes the SELinux mode
  when: (xvpn_common_getenforce.stdout | default('') | trim) != 'Enforcing'

- name: Common | enable and start firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started
  when: not xvpn_common_firewalld_offline

- name: Common | configure the firewall
  ansible.builtin.include_tasks: firewalld.yml
