---
argument_specs:
  main:
    short_description: Rootless service users, SELinux home context, unprivileged ports, linger
    options:
      xvpn_podman_rootless_users:
        description: Service users to create. Names must match C(^[a-z_][a-z0-9_-]{0,30}$).
        type: list
        elements: dict
        default:
          - name: rw-edge
        options:
          name:
            description: User name, regex C(^[a-z_][a-z0-9_-]{0,30}$).
            type: str
            required: true
          uid:
            description: Optional explicit uid, must be >= 1000.
            type: int
      xvpn_podman_rootless_home_root:
        description: >-
          Parent directory of the service user homes. Absolute path whose segments may contain only
          [A-Za-z0-9_-] (no dots), and not a system directory such as /usr, /var or /home.
        type: str
        default: /var/lib/xvpn
      xvpn_podman_rootless_packages:
        description: Required packages.
        type: list
        elements: str
      xvpn_podman_rootless_optional_packages:
        description: Packages installed only when the enabled repositories offer them.
        type: list
        elements: str
        default:
          - passt-selinux
      xvpn_podman_rootless_unprivileged_port_start:
        description: Value of net.ipv4.ip_unprivileged_port_start, validated to the range 1..80 so that ports 80 and 443 stay bindable.
        type: int
        default: 80
      xvpn_podman_rootless_sysctl_file:
        description: Sysctl drop-in file.
        type: str
        default: /etc/sysctl.d/99-xvpn-unprivileged-ports.conf
      xvpn_podman_rootless_manage_user_manager:
        description: Start user@UID.service and wait for its bus socket.
        type: bool
        default: true
  quadlet:
    short_description: Deploy Quadlet units for one service user through fedora.linux_system_roles.podman
    options:
      xvpn_podman_rootless_quadlet_user:
        description: Service user that owns the units, regex C(^[a-z_][a-z0-9_-]{0,30}$).
        type: str
        required: true
      xvpn_podman_rootless_quadlet_specs:
        description: >-
          Quadlet specs passed to the LSR podman role. The key set is closed: only C(template_src) and C(state)
          are accepted; extend this specification before passing further keys to the LSR role.
        type: list
        elements: dict
        default: []
        options:
          template_src:
            description: Absolute controller path of the unit template.
            type: str
            required: true
          state:
            description: Desired state of the unit.
            type: str
            choices:
              - present
              - absent
      xvpn_podman_rootless_quadlet_activate:
        description: Start and enable the units.
        type: bool
        default: true
  restart_stale:
    short_description: Restart a user unit when a config file is newer than the unit start or was changed in this run
    options:
      xvpn_podman_rootless_restart_user:
        description: Service user that owns the unit, regex C(^[a-z_][a-z0-9_-]{0,30}$).
        type: str
        required: true
      xvpn_podman_rootless_restart_unit:
        description: Name of the user unit, for example C(traefik.service).
        type: str
        required: true
      xvpn_podman_rootless_restart_files:
        description: >-
          Absolute paths of the files the container reads only at start. The unit is restarted when any of them
          has a modification time later than the start of the unit main process.
        type: list
        elements: str
        required: true
      xvpn_podman_rootless_restart_changed:
        description: Restart regardless of the modification times (a rendering task reported a change in this run).
        type: bool
        default: false
