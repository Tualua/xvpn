---
argument_specs:
  main:
    short_description: Remnawave Panel stack, bootstrap and gate (secrets, stack, bootstrap and routes so far)
    options:
      xvpn_panel_domain:
        description: Public FQDN of the Panel, lowercase, not an example.* placeholder.
        type: str
        required: true
      xvpn_subscription_domain:
        description: Public FQDN of the subscription page, required while it is enabled, different from the Panel domain.
        type: str
        default: ""
      xvpn_panel_subscription_enabled:
        description: Deploy the subscription page.
        type: bool
        default: true
      xvpn_panel_subscription_image:
        description: Subscription page image with an exact tag.
        type: str
        default: docker.io/remnawave/subscription-page:8.0.1
      xvpn_panel_subscription_port:
        description: Loopback port of the subscription page behind Traefik.
        type: int
        default: 3010
      xvpn_panel_user:
        description: Service user that owns the Panel stack.
        type: str
        default: rw-panel
      xvpn_panel_backend_image:
        description: Backend image with an exact tag.
        type: str
        default: docker.io/remnawave/backend:3.4.11
      xvpn_panel_postgres_image:
        description: Postgres image with an exact tag.
        type: str
        default: docker.io/library/postgres:18.4
      xvpn_panel_valkey_image:
        description: Valkey image with an exact tag.
        type: str
        default: docker.io/valkey/valkey:9-alpine
      xvpn_panel_postgres_user:
        description: Postgres user of the backend database.
        type: str
        default: remnawave
      xvpn_panel_postgres_db:
        description: Postgres database name of the backend.
        type: str
        default: remnawave
      xvpn_panel_jwt_auth_lifetime:
        description: JWT access-token lifetime of the backend, hours.
        type: int
        default: 12
      xvpn_panel_activate:
        description: Start the stack units; false only renders and validates.
        type: bool
        default: true
      xvpn_panel_app_secret:
        description: Vault override of APP_SECRET; empty means stored or generated. Cannot be rotated in v1.
        type: str
        default: ""
        no_log: true
      xvpn_panel_postgres_password:
        description: Vault override of the Postgres password; empty means stored or generated. Cannot be rotated in v1.
        type: str
        default: ""
        no_log: true
      xvpn_panel_metrics_password:
        description: Vault override of the metrics password; empty means stored or generated. Cannot be rotated in v1.
        type: str
        default: ""
        no_log: true
      xvpn_panel_admin_password:
        description: Vault override of the first admin password; empty means stored or generated. Cannot be rotated in v1.
        type: str
        default: ""
        no_log: true
      xvpn_panel_gate_path:
        description: Vault override of the secret gate path; replaces the stored value and regenerates the cookie value.
        type: str
        default: ""
        no_log: true
      xvpn_panel_gate_cookie_name:
        description: Vault override of the gate cookie name; replaces the stored value.
        type: str
        default: ""
        no_log: true
      xvpn_panel_gate_cookie_value:
        description: Vault override of the gate cookie value; replaces the stored value.
        type: str
        default: ""
        no_log: true
      xvpn_panel_gate_cookie_max_age:
        description: Lifetime of the gate cookie, seconds.
        type: int
        default: 2592000
      xvpn_panel_gate_cookie_samesite:
        description: SameSite attribute of the gate cookie; Lax lets OAuth2/Telegram callbacks keep the session.
        type: str
        default: Strict
        choices: [Strict, Lax]
      xvpn_panel_admin_url_file:
        description: Path of the 0600 file that holds the secret admin entry URL on the Panel host.
        type: str
        default: "{{ xvpn_panel_home }}/secrets/admin-url"
      xvpn_panel_admin_username:
        description: User name of the first administrator registered over the loopback port (not admin).
        type: str
        default: rwoperator
      xvpn_panel_api_token_name:
        description: Name of the automation API token created in the Panel.
        type: str
        default: xvpn-automation
      xvpn_panel_api_token_days:
        description: Lifetime of the automation API token, days.
        type: int
        default: 3650
      xvpn_panel_bootstrap_retries:
        description: Attempts, 5 s apart, to wait for the backend auth status before the bootstrap fails.
        type: int
        default: 60
      xvpn_panel_api_token_file:
        description: Path of the 0600 token file on the Panel host.
        type: str
        default: "{{ xvpn_panel_home }}/secrets/api-token"
      xvpn_panel_api_token_probe_route:
        description: Backend route that proves a token is accepted (internal).
        type: str
        default: /api/nodes
      xvpn_panel_failure_log_dir:
        description: >-
          Root-only directory for the stack-start failure log; panel-start-failure.log inside it is mode 0600 and
          removed after a successful start.
        type: str
        default: /var/log/xvpn
      xvpn_panel_home:
        description: Home of the service user (internal).
        type: str
        default: "{{ xvpn_podman_rootless_home_root | default('/var/lib/xvpn') }}/{{ xvpn_panel_user }}"
      xvpn_panel_secrets_file:
        description: Path of the generate-once secrets file (internal).
        type: str
        default: "{{ xvpn_panel_home }}/secrets/panel-secrets.yml"
      xvpn_panel_env_dir:
        description: Directory of the rendered environment files (internal).
        type: str
        default: "{{ xvpn_panel_home }}/env"
