---
# Generate-once secrets file of the Panel host (D-07). The file is the only copy of the Panel secrets: nothing is
# copied to the controller. Generation runs on the controller in memory (lookup password with /dev/null writes no
# file), the merged result is written by one copy task. Every task that touches a value has no_log and diff: false.
- name: Panel secrets | create the secrets directory
  ansible.builtin.file:
    path: "{{ xvpn_panel_home }}/secrets"
    state: directory
    owner: "{{ xvpn_panel_user }}"
    group: "{{ xvpn_panel_user }}"
    mode: "0700"

- name: Panel secrets | stat the secrets file
  ansible.builtin.stat:
    path: "{{ xvpn_panel_secrets_file }}"
  register: xvpn_panel_secrets_stat

# Pitfall 6 (extends D-10): a missing secrets file next to an existing database volume means the secrets were lost.
# Generating new ones would never match the initialised database, so the run stops instead.
- name: Panel secrets | stat the database volume
  ansible.builtin.stat:
    path: "{{ xvpn_panel_home }}/.local/share/containers/storage/volumes/remnawave-db-data"
  register: xvpn_panel_db_volume_stat

- name: Panel secrets | refuse to generate new secrets next to an existing database volume
  ansible.builtin.assert:
    that:
      - xvpn_panel_secrets_stat.stat.exists or not xvpn_panel_db_volume_stat.stat.exists
    fail_msg: >-
      panel-secrets.yml is missing but the database volume remnawave-db-data exists: restore the secrets file
      from backup (Phase 5) or remove the volume deliberately; refusing to generate new secrets
    quiet: true

- name: Panel secrets | read the stored secrets
  ansible.builtin.slurp:
    src: "{{ xvpn_panel_secrets_file }}"
  register: xvpn_panel_secrets_slurp
  no_log: true
  when: xvpn_panel_secrets_stat.stat.exists

- name: Panel secrets | parse the stored secrets
  ansible.builtin.set_fact:
    xvpn_panel_secrets_stored: "{{ (xvpn_panel_secrets_slurp.content | b64decode | from_yaml) if xvpn_panel_secrets_stat.stat.exists else {} }}"
  no_log: true

# An existing but emptied, scalar, list or foreign-key file is never treated as {}: the merge would
# silently generate new secrets over data that may belong to an initialised database. The verdict is a plain
# boolean, so the assert below can fail with a visible message and carries no secret.
- name: Panel secrets | check that the stored file is a mapping of the known keys
  ansible.builtin.set_fact:
    xvpn_panel_secrets_file_ok: >-
      {{ not xvpn_panel_secrets_stat.stat.exists
         or (xvpn_panel_secrets_stored is mapping
             and xvpn_panel_secrets_stored | length > 0
             and xvpn_panel_secrets_stored.keys() | list | difference(xvpn_panel_secret_keys) | length == 0) }}
  no_log: true
  vars:
    xvpn_panel_secret_keys:
      - app_secret
      - postgres_password
      - metrics_user
      - metrics_password
      - admin_password
      - gate_path
      - gate_cookie_name
      - gate_cookie_value

- name: Panel secrets | assert the stored file is usable
  ansible.builtin.assert:
    that:
      - xvpn_panel_secrets_file_ok | bool
    fail_msg: >-
      panel-secrets.yml is corrupt or not a mapping of the known keys: restore it from backup (Phase 5);
      refusing to merge over it
    quiet: true

# One set_fact: each lookup is evaluated once (RESEARCH Pitfall 3). The password lookup with /dev/null generates
# in memory and writes nothing. Alphanumeric values are safe in DATABASE_URL, YAML and Traefik regexes.
- name: Panel secrets | generate candidate values
  ansible.builtin.set_fact:
    xvpn_panel_secrets_generated:
      app_secret: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=64) }}"
      postgres_password: >-
        {{ ([lookup('ansible.builtin.password', '/dev/null', chars=['ascii_lowercase'], length=8),
             lookup('ansible.builtin.password', '/dev/null', chars=['ascii_uppercase'], length=8),
             lookup('ansible.builtin.password', '/dev/null', chars=['digits'], length=8),
             lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=8)]
            | join('') | list | shuffle | join('')) }}
      metrics_user: "m{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_lowercase'], length=11) }}"
      metrics_password: >-
        {{ ([lookup('ansible.builtin.password', '/dev/null', chars=['ascii_lowercase'], length=8),
             lookup('ansible.builtin.password', '/dev/null', chars=['ascii_uppercase'], length=8),
             lookup('ansible.builtin.password', '/dev/null', chars=['digits'], length=8),
             lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=8)]
            | join('') | list | shuffle | join('')) }}
      admin_password: >-
        {{ ([lookup('ansible.builtin.password', '/dev/null', chars=['ascii_lowercase'], length=8),
             lookup('ansible.builtin.password', '/dev/null', chars=['ascii_uppercase'], length=8),
             lookup('ansible.builtin.password', '/dev/null', chars=['digits'], length=8),
             lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=16)]
            | join('') | list | shuffle | join('')) }}
      gate_path: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=32) }}"
      gate_cookie_name: "s{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_lowercase'], length=9) }}"
      gate_cookie_value: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=48) }}"
  no_log: true

# Non-empty vault overrides only.
- name: Panel secrets | collect the vault overrides
  ansible.builtin.set_fact:
    xvpn_panel_secrets_overrides: >-
      {{ {'app_secret': xvpn_panel_app_secret | default('', true) | string,
          'postgres_password': xvpn_panel_postgres_password | default('', true) | string,
          'metrics_password': xvpn_panel_metrics_password | default('', true) | string,
          'admin_password': xvpn_panel_admin_password | default('', true) | string,
          'gate_path': xvpn_panel_gate_path | default('', true) | string,
          'gate_cookie_name': xvpn_panel_gate_cookie_name | default('', true) | string,
          'gate_cookie_value': xvpn_panel_gate_cookie_value | default('', true) | string}
         | dict2items | rejectattr('value', 'equalto', '') | list | items2dict }}
  no_log: true

# Merge: override, else stored, else generated. D-06: the gate secret is the path together with the cookie value,
# so a changed path without an explicit cookie value takes a freshly generated cookie value.
- name: Panel secrets | merge override, stored and generated values
  ansible.builtin.set_fact:
    xvpn_panel_secrets_merged: >-
      {{ xvpn_panel_secrets_generated | combine(xvpn_panel_secrets_stored) | combine(xvpn_panel_secrets_overrides)
         | combine({'gate_cookie_value': xvpn_panel_secrets_generated.gate_cookie_value}
                   if ('gate_path' in xvpn_panel_secrets_stored
                       and 'gate_path' in xvpn_panel_secrets_overrides
                       and xvpn_panel_secrets_overrides.gate_path != xvpn_panel_secrets_stored.gate_path
                       and 'gate_cookie_value' not in xvpn_panel_secrets_overrides)
                   else {}) }}
  no_log: true

# DOC-04, D-11: placeholders and weak values are rejected for overrides and stored values alike. The message names
# the keys only. Formats: URL-safe where the value lands in DATABASE_URL, the backend password policy for the admin.
- name: Panel secrets | find placeholder or badly formatted values
  ansible.builtin.set_fact:
    xvpn_panel_secrets_invalid_json: >-
      {%- set ns = namespace(keys=[]) -%}
      {%- for k, rx in xvpn_panel_secret_formats.items() -%}
      {%- set v = xvpn_panel_secrets_merged[k] | string -%}
      {%- if not (v is regex(rx))
             or (v | lower | replace('_', '') | replace('-', '') is regex(xvpn_panel_secret_weak_words))
             or (v is regex('^<.*>$')) -%}
      {%- set ns.keys = ns.keys + [k] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.keys | to_json }}
  vars:
    xvpn_panel_secret_weak_words: 'changeme|password|secret|admin|postgres|example|remnawave|xvpn'
    xvpn_panel_secret_formats:
      app_secret: '^[A-Za-z0-9_-]{32,}$'
      postgres_password: '^[A-Za-z0-9]{16,}$'
      metrics_user: '^[a-z][a-z0-9]{3,}$'
      metrics_password: '^[A-Za-z0-9]{16,}$'
      admin_password: '^(?=.*?[A-Z])(?=.*?[a-z])(?=.*?[0-9]).{24,}$'
      gate_path: '^[A-Za-z0-9_]{16,}$'
      gate_cookie_name: '^[A-Za-z][A-Za-z0-9_]{3,}$'
      gate_cookie_value: '^[A-Za-z0-9_]{16,}$'
  no_log: true

- name: Panel secrets | refuse placeholder or weak values (DOC-04)
  ansible.builtin.assert:
    that:
      - xvpn_panel_secrets_invalid_json | from_json | length == 0
    fail_msg: >-
      {{ xvpn_panel_secrets_invalid_json | from_json | join(', ') }}: the value is a placeholder or does not
      match the required format (DOC-04)
    quiet: true

# D-10: v1 has no rotation. An override that differs from the applied value fails, naming the key only.
# gate_path, gate_cookie_name and gate_cookie_value are exempt (D-06): the override replaces the stored value.
- name: Panel secrets | find overrides that differ from the applied secrets
  ansible.builtin.set_fact:
    xvpn_panel_secrets_divergent_json: >-
      {%- set ns = namespace(keys=[]) -%}
      {%- for k in ['app_secret', 'postgres_password', 'metrics_password', 'admin_password'] -%}
      {%- if k in xvpn_panel_secrets_overrides and k in xvpn_panel_secrets_stored
             and (xvpn_panel_secrets_overrides[k] | string) != (xvpn_panel_secrets_stored[k] | string) -%}
      {%- set ns.keys = ns.keys + [k] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.keys | to_json }}
  no_log: true

- name: Panel secrets | refuse to rotate an applied secret (D-10)
  ansible.builtin.assert:
    that:
      - xvpn_panel_secrets_divergent_json | from_json | length == 0
    fail_msg: >-
      {{ xvpn_panel_secrets_divergent_json | from_json | join(', ') }}: the vault value differs from the secret
      already applied on this host; v1 has no secret rotation (D-10), change the vault value back or rotate manually
    quiet: true

- name: Panel secrets | write the secrets file
  ansible.builtin.copy:
    content: "{{ xvpn_panel_secrets_merged | to_nice_yaml }}"
    dest: "{{ xvpn_panel_secrets_file }}"
    owner: "{{ xvpn_panel_user }}"
    group: "{{ xvpn_panel_user }}"
    mode: "0600"
  diff: false
  no_log: true

# Run-scoped fact for the stack, bootstrap, gate and subscription tasks (never persisted).
- name: Panel secrets | expose the secrets to the later tasks
  ansible.builtin.set_fact:
    xvpn_panel_secrets: "{{ xvpn_panel_secrets_merged }}"
  no_log: true
