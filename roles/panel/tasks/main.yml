---
# Domains are operator input, not secrets, so they are echoed in the failure message.
- name: Panel | validate the Panel domain
  ansible.builtin.assert:
    that:
      - xvpn_panel_domain is regex('^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?[.])+([a-z]{2,63}|xn--[a-z0-9]([a-z0-9-]{0,57}[a-z0-9])?)$')
      - not (xvpn_panel_domain is regex('(^|[.])example[.](com|org|net)$'))
    fail_msg: "xvpn_panel_domain must be a real lowercase FQDN, got '{{ xvpn_panel_domain }}'"
    quiet: true

# D-12: the subscription page gets its own domain, a different one from the Panel.
- name: Panel | validate the subscription domain
  ansible.builtin.assert:
    that:
      - xvpn_subscription_domain is regex('^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?[.])+([a-z]{2,63}|xn--[a-z0-9]([a-z0-9-]{0,57}[a-z0-9])?)$')
      - not (xvpn_subscription_domain is regex('(^|[.])example[.](com|org|net)$'))
      - xvpn_subscription_domain != xvpn_panel_domain
    fail_msg: >-
      xvpn_subscription_domain must be a real lowercase FQDN different from xvpn_panel_domain,
      got '{{ xvpn_subscription_domain }}'
    quiet: true
  when: xvpn_panel_subscription_enabled | bool

- name: Panel | look up the service user
  ansible.builtin.getent:
    database: passwd
    key: "{{ xvpn_panel_user }}"
    fail_key: false

- name: Panel | require the service user
  ansible.builtin.assert:
    that:
      - ansible_facts['getent_passwd'][xvpn_panel_user] is not none
    fail_msg: "service user {{ xvpn_panel_user }} does not exist; run xvpn.remnawave.podman_rootless with {{ xvpn_panel_user }} first"
    quiet: true

- name: Panel | generate-once secrets file
  ansible.builtin.include_tasks: secrets.yml

- name: Panel | deploy the Postgres, Valkey and backend stack
  ansible.builtin.include_tasks: stack.yml

# PANEL-03: the admin is registered on loopback before the Panel route file exists.
- name: Panel | register the first admin and create the API token
  ansible.builtin.include_tasks: bootstrap.yml
  when: xvpn_panel_activate | bool

# D-17: the page needs the bootstrap token, so it follows the bootstrap and precedes the route files.
- name: Panel | deploy the subscription page
  ansible.builtin.include_tasks: subpage.yml

- name: Panel | publish the Panel-domain routes through the edge
  ansible.builtin.include_tasks: routes.yml

# D-06: the admin entry URL is stored, never printed.
- name: Panel | write the admin entry URL file
  ansible.builtin.copy:
    content: "https://{{ xvpn_panel_domain }}/{{ xvpn_panel_secrets.gate_path }}\n"
    dest: "{{ xvpn_panel_admin_url_file }}"
    owner: "{{ xvpn_panel_user }}"
    group: "{{ xvpn_panel_user }}"
    mode: "0600"
  diff: false
  no_log: true

- name: Panel | report where the secrets, the token and the admin URL live
  ansible.builtin.debug:
    msg: >-
      Panel secrets: {{ xvpn_panel_secrets_file }}; API token: {{ xvpn_panel_api_token_file }};
      Admin entry URL: stored in {{ xvpn_panel_admin_url_file }} on the Panel host (read on the Panel host only)
  when: xvpn_panel_activate | bool
