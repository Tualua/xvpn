---
# Panel stack (PANEL-01): Postgres, Valkey and the backend as rootless Quadlet units of the service user on the
# user-defined network remnawave. Secrets reach the containers only through 0600 env files (D-07, D-11).
- name: Panel stack | validate the JWT lifetime
  ansible.builtin.assert:
    that:
      - xvpn_panel_jwt_auth_lifetime | int >= 12
      - xvpn_panel_jwt_auth_lifetime | int <= 168
    fail_msg: "xvpn_panel_jwt_auth_lifetime must be between 12 and 168 hours"
    quiet: true

# The directory is forced to root:root 0700, so only a dedicated directory below an allowed base is accepted. The
# pattern admits no '.', '..' or empty path component (so no '/var/log/.', '/var//x' or a trailing slash). It ends in
# \Z, not $: $ would also accept a trailing newline.
- name: Panel stack | validate the failure log directory
  ansible.builtin.assert:
    that:
      - xvpn_panel_failure_log_dir is string
      - xvpn_panel_failure_log_dir is match('^/(var/log|opt|srv)(/[A-Za-z0-9_-][A-Za-z0-9_.-]*)+\Z')
      - xvpn_panel_failure_log_dir != xvpn_panel_home
      - not (xvpn_panel_home ~ '/').startswith(xvpn_panel_failure_log_dir ~ '/')
    fail_msg: >-
      xvpn_panel_failure_log_dir must be a dedicated absolute directory below /var/log, /opt or /srv (for example
      /var/log/xvpn): no '.', '..' or empty path components, no trailing slash, and not the service user's home
      or one of its parents
    quiet: true

- name: Panel stack | create the env directory
  ansible.builtin.file:
    path: "{{ xvpn_panel_env_dir }}"
    state: directory
    owner: "{{ xvpn_panel_user }}"
    group: "{{ xvpn_panel_user }}"
    mode: "0700"

- name: Panel stack | render the Postgres env file
  ansible.builtin.template:
    src: postgres.env.j2
    dest: "{{ xvpn_panel_env_dir }}/postgres.env"
    owner: "{{ xvpn_panel_user }}"
    group: "{{ xvpn_panel_user }}"
    mode: "0600"
  register: xvpn_panel_postgres_env
  diff: false
  no_log: true

- name: Panel stack | render the backend env file
  ansible.builtin.template:
    src: backend.env.j2
    dest: "{{ xvpn_panel_env_dir }}/backend.env"
    owner: "{{ xvpn_panel_user }}"
    group: "{{ xvpn_panel_user }}"
    mode: "0600"
  register: xvpn_panel_backend_env
  diff: false
  no_log: true

# role_path is resolved here, before the include: inside an include_role vars block it would be evaluated
# lazily in the context of the included role (podman_rootless).
- name: Panel stack | build the Quadlet specs
  ansible.builtin.set_fact:
    xvpn_panel_quadlet_specs:
      - template_src: "{{ role_path }}/templates/remnawave.network.j2"
      - template_src: "{{ role_path }}/templates/remnawave-db.volume.j2"
      - template_src: "{{ role_path }}/templates/remnawave-db.container.j2"
      - template_src: "{{ role_path }}/templates/remnawave-valkey.volume.j2"
      - template_src: "{{ role_path }}/templates/remnawave-redis.container.j2"
      - template_src: "{{ role_path }}/templates/remnawave.container.j2"

# A failed start is reported together with the unit journals, so the cause is visible in the run output.
- name: Panel stack | deploy the Quadlet units
  block:
    - name: Panel stack | run the Quadlet deployment
      ansible.builtin.include_role:
        name: xvpn.remnawave.podman_rootless
        tasks_from: quadlet
      vars:
        xvpn_podman_rootless_quadlet_user: "{{ xvpn_panel_user }}"
        xvpn_podman_rootless_quadlet_specs: "{{ xvpn_panel_quadlet_specs }}"
        xvpn_podman_rootless_quadlet_activate: "{{ xvpn_panel_activate }}"
  rescue:
    # A failure inside the nested log-saving block overwrites ansible_failed_task, so the name is recorded first.
    - name: Panel stack | record the failed task of the stack start
      ansible.builtin.set_fact:
        xvpn_panel_start_failed_task: "{{ ansible_failed_task.name | default('unknown') }}"
        xvpn_panel_start_log_saved: false

    - name: Panel stack | collect the unit journals of the failed start
      ansible.builtin.command:
        argv:
          - journalctl
          - --no-pager
          - -n
          - "80"
          - "_UID={{ ansible_facts['getent_passwd'][xvpn_panel_user][1] }}"
      register: xvpn_panel_start_journal
      changed_when: false
      failed_when: false
      no_log: true

    - name: Panel stack | collect the container logs of the failed start
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          podman ps -a --format '{{ '{{' }}.Names{{ '}}' }} {{ '{{' }}.Status{{ '}}' }}'
          for c in remnawave-db remnawave-redis remnawave; do echo "== $c"; podman logs --tail 20 "$c" 2>&1; done
          echo "== redis command"
          podman inspect --format '{{ '{{' }}json .Config.Cmd{{ '}}' }} {{ '{{' }}json .Config.Entrypoint{{ '}}' }}' remnawave-redis 2>&1
          grep -h '^ExecStart' "/run/user/{{ ansible_facts['getent_passwd'][xvpn_panel_user][1] }}/systemd/generator/remnawave-redis.service" 2>&1
        executable: /bin/bash
      become: true
      become_user: "{{ xvpn_panel_user }}"
      become_method: ansible.builtin.sudo
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][xvpn_panel_user][1] }}"
      register: xvpn_panel_start_logs
      changed_when: false
      failed_when: false
      no_log: true

    - name: Panel stack | collect the container status of the failed start
      ansible.builtin.command:
        argv:
          - podman
          - ps
          - -a
          - --format
          - "{{ '{{' }}.Names{{ '}}' }} {{ '{{' }}.Status{{ '}}' }}"
      become: true
      become_user: "{{ xvpn_panel_user }}"
      become_method: ansible.builtin.sudo
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][xvpn_panel_user][1] }}"
      register: xvpn_panel_start_ps
      changed_when: false
      failed_when: false

    # The journals and container logs may echo env values, so they never reach the Ansible output (it ends up in
    # CI logs of a public collection). The full text goes to a root-only file on the host instead. The nested block
    # sets the flag only after both the directory and the file were written in this run.
    - name: Panel stack | save the failure logs to a root-only file
      block:
        - name: Panel stack | create the root-only directory for the failure logs
          ansible.builtin.file:
            path: "{{ xvpn_panel_failure_log_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Panel stack | save the unit journals and container logs to a root-only file
          ansible.builtin.copy:
            content: |
              == journal
              {{ xvpn_panel_start_journal.stdout | default('') }}
              == containers
              {{ xvpn_panel_start_logs.stdout | default('') }}
            dest: "{{ xvpn_panel_failure_log_dir }}/panel-start-failure.log"
            owner: root
            group: root
            mode: "0600"
          diff: false
          no_log: true

        - name: Panel stack | mark the failure logs as saved
          ansible.builtin.set_fact:
            xvpn_panel_start_log_saved: true
      rescue:
        - name: Panel stack | mark the failure logs as not saved
          ansible.builtin.set_fact:
            xvpn_panel_start_log_saved: false

    - name: Panel stack | fail without the raw logs
      ansible.builtin.fail:
        msg: >-
          Panel stack start failed at task "{{ xvpn_panel_start_failed_task | default('unknown') }}" (the module error text
          is not echoed, it may contain secret values).
          containers: {{ xvpn_panel_start_ps.stdout_lines | default([]) | join(' | ') }}
          {{ 'The unit journals and container logs are in ' ~ xvpn_panel_failure_log_dir ~ '/panel-start-failure.log (root-only, 0600) on the Panel host.'
             if (xvpn_panel_start_log_saved | default(false))
             else 'The unit journals and container logs could not be saved; inspect them on the Panel host with journalctl.' }}

# A successful start leaves no stale failure log with env echoes behind.
- name: Panel stack | remove the failure log of an earlier failed start
  ansible.builtin.file:
    path: "{{ xvpn_panel_failure_log_dir }}/panel-start-failure.log"
    state: absent

# The env file is read at container creation, so a change needs a restart of that unit only (Pitfall 7). The
# restart also fires for a file that is newer than the running unit, so a run that failed after rendering heals
# on the next run.
- name: Panel stack | restart Postgres after an env file change
  ansible.builtin.include_role:
    name: xvpn.remnawave.podman_rootless
    tasks_from: restart_stale
  vars:
    xvpn_podman_rootless_restart_user: "{{ xvpn_panel_user }}"
    xvpn_podman_rootless_restart_unit: remnawave-db.service
    xvpn_podman_rootless_restart_files:
      - "{{ xvpn_panel_env_dir }}/postgres.env"
    xvpn_podman_rootless_restart_changed: "{{ xvpn_panel_postgres_env is changed }}"
  when: xvpn_panel_activate | bool

- name: Panel stack | restart the backend after an env file change
  ansible.builtin.include_role:
    name: xvpn.remnawave.podman_rootless
    tasks_from: restart_stale
  vars:
    xvpn_podman_rootless_restart_user: "{{ xvpn_panel_user }}"
    xvpn_podman_rootless_restart_unit: remnawave.service
    xvpn_podman_rootless_restart_files:
      - "{{ xvpn_panel_env_dir }}/backend.env"
    xvpn_podman_rootless_restart_changed: "{{ xvpn_panel_backend_env is changed }}"
  when: xvpn_panel_activate | bool
