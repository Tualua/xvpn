---
# Read-only checks only. Every error is collected and reported by one final fail.
- name: Preflight | start with empty error and warning lists
  ansible.builtin.set_fact:
    xvpn_preflight_errors: []
    xvpn_preflight_warnings: []
    # The check files accumulate into these with default([]); reset so a second
    # include of the role in one play does not see the previous run's findings.
    xvpn_preflight_listeners: []
    xvpn_preflight_listeners_named: []
    xvpn_preflight_dns_resolved: []

# One effective accepted set: a user managed by podman_rootless can never be missing here (W-5).
- name: Preflight | compute the accepted service user set
  ansible.builtin.set_fact:
    xvpn_preflight_accepted_users: >-
      {{ (xvpn_preflight_service_users
      + (xvpn_podman_rootless_users | default([]) | map(attribute='name') | list)) | unique | list }}

# Input validation (T-01-07): malformed input fails here, before any command runs.
- name: Preflight | validate ports
  ansible.builtin.assert:
    that:
      - item is integer
      - item | int >= 1
      - item | int <= 65535
    quiet: true
    fail_msg: "Invalid port {{ item | string }} in xvpn_preflight_ports: must be an integer 1-65535"
  loop: "{{ xvpn_preflight_ports }}"

- name: Preflight | validate domains
  ansible.builtin.assert:
    that:
      - item is string
      - item is match('^(?=.{1,253}$)([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?[.])+[a-z][a-z0-9-]{0,62}$')
    quiet: true
    fail_msg: >-
      Invalid domain {{ item | string }} in xvpn_preflight_domains:
      use lowercase DNS names (internationalised names in punycode xn-- form)
  loop: "{{ xvpn_preflight_domains }}"

- name: Preflight | validate xvpn_public_ip
  ansible.builtin.assert:
    that:
      - >-
        xvpn_public_ip == ''
        or (xvpn_public_ip is match('^[0-9]{1,3}([.][0-9]{1,3}){3}$')
        and (xvpn_public_ip.split('.') | map('int') | max) <= 255)
    quiet: true
    fail_msg: "Invalid xvpn_public_ip {{ xvpn_public_ip }}: expected an empty value or a dotted IPv4 address"

- name: Preflight | validate xvpn_public_interface
  ansible.builtin.assert:
    that:
      - xvpn_public_interface == '' or xvpn_public_interface is match('^[A-Za-z0-9_.:-]{1,15}$')
    quiet: true
    fail_msg: "Invalid xvpn_public_interface {{ xvpn_public_interface }}: expected an interface name"

- name: Preflight | validate service user names
  ansible.builtin.assert:
    that:
      - item is string
      - item is match('^[a-z_][a-z0-9_-]{0,30}$')
    quiet: true
    fail_msg: "Invalid service user name {{ item | string }}: expected a lowercase Linux user name"
  loop: "{{ xvpn_preflight_accepted_users }}"

- name: Preflight | check the operating system
  ansible.builtin.set_fact:
    xvpn_preflight_errors: >-
      {{ xvpn_preflight_errors + ['Unsupported OS: '
      ~ ansible_facts['distribution'] ~ ' ' ~ ansible_facts['distribution_major_version']
      ~ ' (supported: ' ~ xvpn_preflight_supported_distributions | join('/')
      ~ ' ' ~ xvpn_preflight_supported_major_versions | join('/') ~ ')'] }}
  when: >-
    ansible_facts['distribution'] not in xvpn_preflight_supported_distributions
    or ansible_facts['distribution_major_version'] not in xvpn_preflight_supported_major_versions

# The selinux fact is not used: without python3-libselinux it reports a missing library, not the mode.
- name: Preflight | read the SELinux mode
  ansible.builtin.command: getenforce
  register: xvpn_preflight_getenforce
  changed_when: false
  failed_when: false
  check_mode: false

- name: Preflight | check that SELinux is Enforcing
  ansible.builtin.set_fact:
    xvpn_preflight_errors: >-
      {{ xvpn_preflight_errors + ['SELinux must be Enforcing, getenforce reports: '
      ~ (xvpn_preflight_getenforce.stdout | trim)] }}
  when:
    - xvpn_preflight_getenforce.rc | default(1) == 0
    - (xvpn_preflight_getenforce.stdout | trim) != 'Enforcing'

- name: Preflight | report that getenforce could not run
  ansible.builtin.set_fact:
    xvpn_preflight_errors: >-
      {{ xvpn_preflight_errors + ['SELinux must be Enforcing, getenforce reports: '
      ~ 'getenforce not found or failed (rc ' ~ (xvpn_preflight_getenforce.rc | default('none'))
      ~ '); install libselinux-utils'] }}
  when:
    - xvpn_preflight_getenforce.rc | default(1) != 0
    - (xvpn_preflight_getenforce.stdout | default('') | trim) == ''

- name: Preflight | check Podman version floor
  ansible.builtin.include_tasks: check_podman.yml

- name: Preflight | check ports
  ansible.builtin.include_tasks: check_ports.yml

- name: Preflight | note that the A-record check is inactive without domains
  ansible.builtin.set_fact:
    xvpn_preflight_warnings: >-
      {{ xvpn_preflight_warnings + ['A-record check skipped: xvpn_preflight_domains is empty'] }}
  when:
    - xvpn_preflight_dns_check | bool
    - xvpn_preflight_domains | length == 0

- name: Preflight | check DNS A records
  ansible.builtin.include_tasks: check_dns.yml
  when:
    - xvpn_preflight_dns_check | bool
    - xvpn_preflight_domains | length > 0

- name: Preflight | show warnings
  ansible.builtin.debug:
    msg: "WARNING: {{ item }}"
  loop: "{{ xvpn_preflight_warnings }}"

- name: Preflight | fail once with every collected error
  ansible.builtin.fail:
    msg: |-
      Preflight failed on {{ inventory_hostname }}; nothing was changed:
      {% for e in xvpn_preflight_errors %}
      - {{ e }}
      {% endfor %}
  when: xvpn_preflight_errors | length > 0
