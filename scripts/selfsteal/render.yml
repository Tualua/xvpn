---
# Renders the PRODUCTION edge and node self-steal templates for the self-steal gate (scripts/selfsteal/run.sh).
# Nothing is copied or re-typed: the templates are read from the roles.
# Input: xvpn_selfsteal_work (work directory, extra var).
- name: Self-steal gate | render the production templates
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../roles/edge/vars/main.yml
    - ../../roles/node/vars/main.yml
  vars:
    xvpn_selfsteal_root: "{{ playbook_dir }}/../.."
    xvpn_edge_http_address: ":8080"
    xvpn_edge_https_address: "127.0.0.1:8443"
    xvpn_edge_acme_ca: custom
    xvpn_edge_acme_ca_server: https://127.0.0.1:14000/dir
    xvpn_edge_acme_trusted_ca_file: /etc/pebble/certs/pebble.minica.pem
    xvpn_edge_acme_email: ""
    xvpn_edge_decoy_port: 18080
    # the node case: strict 404 and the domain-selected template, installed by the production decoy.yml
    xvpn_edge_decoy_strict: true
    xvpn_edge_decoy_template: ""
    xvpn_edge_decoy_src: ""
    xvpn_edge_decoy_brand: ""
    xvpn_edge_decoy_select_key: node.test
    xvpn_edge_home: "{{ xvpn_selfsteal_work }}/edge-home"
    xvpn_edge_user: "{{ lookup('ansible.builtin.env', 'USER') | default(lookup('ansible.builtin.pipe', 'id -un'), true) }}"
    xvpn_edge_role_dir: "{{ playbook_dir }}/../../roles/edge"
    xvpn_node_domain: node.test
    xvpn_node_inbound_tag: vless-reality-gate
  tasks:
    - name: Self-steal gate | require the work directory
      ansible.builtin.assert:
        that:
          - xvpn_selfsteal_work is defined
          - xvpn_selfsteal_work | length > 0
        quiet: true

    - name: Self-steal gate | create the work directories
      ansible.builtin.file:
        path: "{{ xvpn_selfsteal_work }}/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - static
        - dynamic
        - decoy/conf.d
        - edge-home/decoy/site

    - name: Self-steal gate | render the Traefik static configuration
      ansible.builtin.template:
        src: "{{ xvpn_selfsteal_root }}/roles/edge/templates/traefik.yml.j2"
        dest: "{{ xvpn_selfsteal_work }}/static/traefik.yml"
        mode: "0644"

    - name: Self-steal gate | render the shared edge dynamic configuration
      ansible.builtin.template:
        src: "{{ xvpn_selfsteal_root }}/roles/edge/templates/00-edge.yml.j2"
        dest: "{{ xvpn_selfsteal_work }}/dynamic/00-edge.yml"
        mode: "0644"

    - name: Self-steal gate | render the node self-steal route
      ansible.builtin.template:
        src: "{{ xvpn_selfsteal_root }}/roles/node/templates/node-selfsteal.yml.j2"
        dest: "{{ xvpn_selfsteal_work }}/dynamic/node-selfsteal.yml"
        mode: "0644"

    - name: Self-steal gate | render the decoy nginx configuration
      ansible.builtin.template:
        src: "{{ xvpn_selfsteal_root }}/roles/edge/templates/decoy-nginx.conf.j2"
        dest: "{{ xvpn_selfsteal_work }}/decoy/conf.d/default.conf"
        mode: "0644"

    - name: Self-steal gate | install the decoy site with the production decoy tasks
      ansible.builtin.include_tasks: ../../roles/edge/tasks/decoy.yml

    - name: Self-steal gate | render the production node profile with the shared test sink override
      ansible.builtin.copy:
        content: >-
          {{ (lookup('ansible.builtin.template', xvpn_selfsteal_root ~ '/roles/node/templates/config-profile.json.j2') | from_json)
          | combine(lookup('ansible.builtin.template', xvpn_selfsteal_root ~ '/extensions/molecule/shared/templates/test-sink-override.json.j2') | from_json,
          recursive=True) | to_nice_json }}
        dest: "{{ xvpn_selfsteal_work }}/profile.json"
        mode: "0644"
