---
- name: Verify the node host (container tier)
  hosts: all
  become: true
  vars:
    ansible_pipelining: true
    xvpn_node_domain: node.xvpn.test
    xvpn_node_panel_sources: ["192.0.2.10"]
    # Every plan that adds a negative case appends its id here and updates the marker count in its verify command.
    xvpn_negative_expected:
      - node-domain-backtick
      - node-domain-case
      - node-domain-example
      - node-image-latest
      - node-image-untagged
      - node-name-short
      - node-profile-dot
      - node-profile-reserved
      - node-state-absent
      - decoy-template-unknown
      - node-activate-register-mismatch
      - panel-source-injection
      - panel-source-missing
    xvpn_verify_templates_all: >-
      {{ (lookup('ansible.builtin.file', playbook_dir ~ '/../../../roles/edge/vars/main.yml') | from_yaml).xvpn_edge_decoy_templates }}
    xvpn_verify_template_names: [blog, business, maintenance, studio]
  tasks:
    - name: Verify the host baseline (SELinux, firewalld ports)
      ansible.builtin.include_tasks: ../shared/verify_common.yml
      vars:
        xvpn_verify_firewall_cmd: firewall-offline-cmd
        xvpn_verify_expected_ports: ["80/tcp"]
        xvpn_verify_expected_rich_rules:
          - 'rule family="ipv4" source address="192.0.2.10" port port="2222" protocol="tcp" accept'

    - name: List the permanent ports of the zone
      ansible.builtin.command:
        argv:
          - firewall-offline-cmd
          - "--zone={{ xvpn_verify_fw_zone }}"
          - --list-ports
      register: xvpn_verify_node_offline_ports
      changed_when: false

    - name: Assert 443/tcp stays closed without the certificate gate
      ansible.builtin.assert:
        that:
          - "'443/tcp' not in xvpn_verify_node_offline_ports.stdout.split()"
        fail_msg: "443/tcp is open although the gate did not run: {{ xvpn_verify_node_offline_ports.stdout }}"
        quiet: true

    - name: Read the rendered static Traefik configuration
      ansible.builtin.slurp:
        src: /var/lib/xvpn/rw-edge/traefik/static/traefik.yml
      register: xvpn_verify_node_static

    - name: Assert TLS is on loopback only and HTTP on :80
      ansible.builtin.assert:
        that:
          - '(xvpn_verify_node_static.content | b64decode) is search(''address: "127.0.0.1:8443"'')'
          - '(xvpn_verify_node_static.content | b64decode) is search(''address: ":80"'')'
        fail_msg: "traefik.yml lacks the loopback websecure or the :80 web address"
        quiet: true

    - name: Read the rendered node route
      ansible.builtin.slurp:
        src: /var/lib/xvpn/rw-edge/traefik/dynamic/node-selfsteal.yml
      register: xvpn_verify_node_route

    - name: Assert the self-steal routers
      ansible.builtin.assert:
        that:
          - xvpn_node_route.http.routers['xvpn-node-https'].rule == 'Host(`node.xvpn.test`)'
          - xvpn_node_route.http.routers['xvpn-node-https'].service == 'xvpn-decoy'
          - xvpn_node_route.http.routers['xvpn-node-https'].entryPoints == ['websecure']
          - xvpn_node_route.http.routers['xvpn-node-https'].tls.certResolver == 'le'
          - xvpn_node_route.http.routers['xvpn-node-http'].rule == 'Host(`node.xvpn.test`)'
          - xvpn_node_route.http.routers['xvpn-node-http'].middlewares == ['xvpn-to-https']
        fail_msg: "node-selfsteal.yml does not route the node domain to the decoy: {{ xvpn_node_route }}"
        quiet: true
      vars:
        xvpn_node_route: "{{ xvpn_verify_node_route.content | b64decode | from_yaml }}"

    # Selection rule, computed independently of the role (python3 on the controller): a divergence from the Jinja
    # rendezvous rule in roles/edge/tasks/decoy.yml fails here.
    - name: Compute the expected decoy template for the node domain
      ansible.builtin.command:
        argv: "{{ ['python3', '-c', xvpn_verify_decoy_py, xvpn_node_domain] + xvpn_verify_decoy_names }}"
      vars:
        xvpn_verify_decoy_py: >-
          import hashlib,sys;key=sys.argv[1];print(max(sys.argv[2:],
          key=lambda n: hashlib.sha256(f"{key}:{n}".encode()).hexdigest()))
        xvpn_verify_decoy_names: >-
          {{ (lookup('ansible.builtin.file', playbook_dir ~ '/../../../roles/edge/vars/main.yml') | from_yaml).xvpn_edge_decoy_templates }}
      delegate_to: localhost
      become: false
      changed_when: false
      register: xvpn_verify_decoy_expected

    - name: Stat the role style sheet of that template on the controller
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../../roles/edge/files/decoy-templates/{{ xvpn_verify_decoy_expected.stdout }}/assets/style.css"
        checksum_algorithm: sha256
      delegate_to: localhost
      become: false
      register: xvpn_verify_decoy_role_css

    - name: Stat the installed decoy site
      ansible.builtin.stat:
        path: "/var/lib/xvpn/rw-edge/decoy/site/{{ item }}"
        checksum_algorithm: sha256
      loop: [assets/style.css, 404.html, index.html, favicon.ico, robots.txt]
      register: xvpn_verify_decoy_site

    - name: Read the decoy nginx configuration and the rendered pages
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /var/lib/xvpn/rw-edge/decoy/conf.d/default.conf
        - /var/lib/xvpn/rw-edge/decoy/site/index.html
        - /var/lib/xvpn/rw-edge/decoy/site/404.html
      register: xvpn_verify_decoy_text

    - name: Assert the node serves the selected template with a real 404
      ansible.builtin.assert:
        that:
          - xvpn_verify_decoy_site.results | map(attribute='stat') | map(attribute='exists') | min
          - (xvpn_verify_decoy_site.results | first).stat.checksum == xvpn_verify_decoy_role_css.stat.checksum
          - "'error_page 404 /404.html' in (xvpn_verify_decoy_text.results[0].content | b64decode)"
          - "'try_files $uri $uri/ =404;' in (xvpn_verify_decoy_text.results[0].content | b64decode)"
          - "'/index.html;' not in (xvpn_verify_decoy_text.results[0].content | b64decode)"
          - "'xvpn' not in (xvpn_verify_decoy_text.results[1].content | b64decode | lower)"
          - "'xvpn' not in (xvpn_verify_decoy_text.results[2].content | b64decode | lower)"
          - "'Node' in (xvpn_verify_decoy_text.results[1].content | b64decode)"
          - "'http://' not in (xvpn_verify_decoy_text.results[1].content | b64decode)"
          - "'https://' not in (xvpn_verify_decoy_text.results[1].content | b64decode)"
        fail_msg: "the node decoy is not the selected template with a strict 404"
        quiet: true

    - name: Stat the node service user linger file
      ansible.builtin.stat:
        path: /var/lib/systemd/linger/rw-node
      register: xvpn_verify_node_linger

    - name: Look up the node service user
      ansible.builtin.getent:
        database: passwd
        key: rw-node

    - name: Assert the node service user exists with linger
      ansible.builtin.assert:
        that:
          - xvpn_verify_node_linger.stat.exists
        fail_msg: "rw-node has no linger file"
        quiet: true

    - name: List the dynamic directory before the node cases
      ansible.builtin.find:
        paths: /var/lib/xvpn/rw-edge/traefik/dynamic
        get_checksum: true
      register: xvpn_verify_dyn_before

    # xvpn_negative_case: node-domain-backtick
    - name: Negative case node-domain-backtick
      block:
        - name: Run the node role with an invalid xvpn_node_domain
          ansible.builtin.include_role:
            name: xvpn.remnawave.node
          vars:
            xvpn_node_domain: 'node.xvpn.test`) || Host(`x'
            xvpn_node_activate: false
            xvpn_node_register: false
        - name: Fail when the invalid input was accepted
          ansible.builtin.fail:
            msg: "negative case node-domain-backtick was accepted"
      rescue:
        - name: Record that the invalid input was rejected
          ansible.builtin.set_fact:
            xvpn_negative_rejected: "{{ (xvpn_negative_rejected | default([])) + ['node-domain-backtick'] }}"
          when:
            - not (ansible_failed_result.msg | string).startswith('negative case')
            - "'xvpn_node_domain' in (ansible_failed_result.msg | string)"

    # xvpn_negative_case: node-domain-case
    - name: Negative case node-domain-case
      block:
        - name: Run the node role with an invalid xvpn_node_domain
          ansible.builtin.include_role:
            name: xvpn.remnawave.node
          vars:
            xvpn_node_domain: 'Node.Example.com'
            xvpn_node_activate: false
            xvpn_node_register: false
        - name: Fail when the invalid input was accepted
          ansible.builtin.fail:
            msg: "negative case node-domain-case was accepted"
      rescue:
        - name: Record that the invalid input was rejected
          ansible.builtin.set_fact:
            xvpn_negative_rejected: "{{ (xvpn_negative_rejected | default([])) + ['node-domain-case'] }}"
          when:
            - not (ansible_failed_result.msg | string).startswith('negative case')
            - "'xvpn_node_domain' in (ansible_failed_result.msg | string)"

    # xvpn_negative_case: node-domain-example
    - name: Negative case node-domain-example
      block:
        - name: Run the node role with an invalid xvpn_node_domain
          ansible.builtin.include_role:
            name: xvpn.remnawave.node
          vars:
            xvpn_node_domain: 'node.example.com'
            xvpn_node_activate: false
            xvpn_node_register: false
        - name: Fail when the invalid input was accepted
          ansible.builtin.fail:
            msg: "negative case node-domain-example was accepted"
      rescue:
        - name: Record that the invalid input was rejected
          ansible.builtin.set_fact:
            xvpn_negative_rejected: "{{ (xvpn_negative_rejected | default([])) + ['node-domain-example'] }}"
          when:
            - not (ansible_failed_result.msg | string).startswith('negative case')
            - "'xvpn_node_domain' in (ansible_failed_result.msg | string)"

    # xvpn_negative_case: node-image-latest
    - name: Negative case node-image-latest
      block:
        - name: Run the node role with an invalid xvpn_node_image
          ansible.builtin.include_role:
            name: xvpn.remnawave.node
          vars:
            xvpn_node_image: 'docker.io/remnawave/node:latest'
            xvpn_node_activate: false
            xvpn_node_register: false
        - name: Fail when the invalid input was accepted
          ansible.builtin.fail:
            msg: "negative case node-image-latest was accepted"
      rescue:
        - name: Record that the invalid input was rejected
          ansible.builtin.set_fact:
            xvpn_negative_rejected: "{{ (xvpn_negative_rejected | default([])) + ['node-image-latest'] }}"
          when:
            - not (ansible_failed_result.msg | string).startswith('negative case')
            - "'xvpn_node_image' in (ansible_failed_result.msg | string)"

    # xvpn_negative_case: node-image-untagged
    - name: Negative case node-image-untagged
      block:
        - name: Run the node role with an invalid xvpn_node_image
          ansible.builtin.include_role:
            name: xvpn.remnawave.node
          vars:
            xvpn_node_image: 'docker.io/remnawave/node'
            xvpn_node_activate: false
            xvpn_node_register: false
        - name: Fail when the invalid input was accepted
          ansible.builtin.fail:
            msg: "negative case node-image-untagged was accepted"
      rescue:
        - name: Record that the invalid input was rejected
          ansible.builtin.set_fact:
            xvpn_negative_rejected: "{{ (xvpn_negative_rejected | default([])) + ['node-image-untagged'] }}"
          when:
            - not (ansible_failed_result.msg | string).startswith('negative case')
            - "'xvpn_node_image' in (ansible_failed_result.msg | string)"

    # xvpn_negative_case: node-name-short
    - name: Negative case node-name-short
      block:
        - name: Run the node role with an invalid xvpn_node_name
          ansible.builtin.include_role:
            name: xvpn.remnawave.node
          vars:
            xvpn_node_name: 'n1'
            xvpn_node_activate: false
            xvpn_node_register: false
        - name: Fail when the invalid input was accepted
          ansible.builtin.fail:
            msg: "negative case node-name-short was accepted"
      rescue:
        - name: Record that the invalid input was rejected
          ansible.builtin.set_fact:
            xvpn_negative_rejected: "{{ (xvpn_negative_rejected | default([])) + ['node-name-short'] }}"
          when:
            - not (ansible_failed_result.msg | string).startswith('negative case')
            - "'xvpn_node_name' in (ansible_failed_result.msg | string)"

    # xvpn_negative_case: node-profile-dot
    - name: Negative case node-profile-dot
      block:
        - name: Run the node role with an invalid xvpn_node_profile_name
          ansible.builtin.include_role:
            name: xvpn.remnawave.node
          vars:
            xvpn_node_profile_name: 'a.b'
            xvpn_node_activate: false
            xvpn_node_register: false
        - name: Fail when the invalid input was accepted
          ansible.builtin.fail:
            msg: "negative case node-profile-dot was accepted"
      rescue:
        - name: Record that the invalid input was rejected
          ansible.builtin.set_fact:
            xvpn_negative_rejected: "{{ (xvpn_negative_rejected | default([])) + ['node-profile-dot'] }}"
          when:
            - not (ansible_failed_result.msg | string).startswith('negative case')
            - "'xvpn_node_profile_name' in (ansible_failed_result.msg | string)"

    # xvpn_negative_case: node-profile-reserved
    - name: Negative case node-profile-reserved
      block:
        - name: Run the node role with an invalid xvpn_node_profile_name
          ansible.builtin.include_role:
            name: xvpn.remnawave.node
          vars:
            xvpn_node_profile_name: 'Default-Profile'
            xvpn_node_activate: false
            xvpn_node_register: false
        - name: Fail when the invalid input was accepted
          ansible.builtin.fail:
            msg: "negative case node-profile-reserved was accepted"
      rescue:
        - name: Record that the invalid input was rejected
          ansible.builtin.set_fact:
            xvpn_negative_rejected: "{{ (xvpn_negative_rejected | default([])) + ['node-profile-reserved'] }}"
          when:
            - not (ansible_failed_result.msg | string).startswith('negative case')
            - "'xvpn_node_profile_name' in (ansible_failed_result.msg | string)"

    # xvpn_negative_case: node-state-absent
    - name: Negative case node-state-absent
      block:
        - name: Run the node role with an invalid xvpn_node_state
          ansible.builtin.include_role:
            name: xvpn.remnawave.node
          vars:
            xvpn_node_state: 'absent'
            xvpn_node_activate: false
            xvpn_node_register: false
        - name: Fail when the invalid input was accepted
          ansible.builtin.fail:
            msg: "negative case node-state-absent was accepted"
      rescue:
        - name: Record that the invalid input was rejected
          ansible.builtin.set_fact:
            xvpn_negative_rejected: "{{ (xvpn_negative_rejected | default([])) + ['node-state-absent'] }}"
          when:
            - not (ansible_failed_result.msg | string).startswith('negative case')
            - "'xvpn_node_state' in (ansible_failed_result.msg | string)"

    # xvpn_negative_case: node-activate-register-mismatch
    - name: Negative case node-activate-register-mismatch
      block:
        - name: Run the node role with the invalid input
          ansible.builtin.include_role:
            name: xvpn.remnawave.node
          vars:
            xvpn_node_activate: false
            xvpn_node_register: true
        - name: Fail when the invalid input was accepted
          ansible.builtin.fail:
            msg: "negative case node-activate-register-mismatch was accepted"
      rescue:
        - name: Record that the invalid input was rejected
          ansible.builtin.set_fact:
            xvpn_negative_rejected: "{{ (xvpn_negative_rejected | default([])) + ['node-activate-register-mismatch'] }}"
          when:
            - not (ansible_failed_result.msg | string).startswith('negative case')
            - "'xvpn_node_activate' in (ansible_failed_result.msg | string) and 'xvpn_node_register' in (ansible_failed_result.msg | string)"

    # xvpn_negative_case: panel-source-injection
    - name: Negative case panel-source-injection
      block:
        - name: Run the node role with the invalid input
          ansible.builtin.include_role:
            name: xvpn.remnawave.node
          vars:
            xvpn_node_panel_sources: ['10.0.0.1; drop']
            xvpn_node_activate: false
            xvpn_node_register: false
        - name: Fail when the invalid input was accepted
          ansible.builtin.fail:
            msg: "negative case panel-source-injection was accepted"
      rescue:
        - name: Record that the invalid input was rejected
          ansible.builtin.set_fact:
            xvpn_negative_rejected: "{{ (xvpn_negative_rejected | default([])) + ['panel-source-injection'] }}"
          when:
            - not (ansible_failed_result.msg | string).startswith('negative case')
            - "'xvpn_node_panel_sources' in (ansible_failed_result.msg | string)"

    # xvpn_negative_case: panel-source-missing
    - name: Negative case panel-source-missing
      block:
        - name: Run the node role with the invalid input
          ansible.builtin.include_role:
            name: xvpn.remnawave.node
          vars:
            xvpn_node_panel_sources: []
            xvpn_node_activate: false
            xvpn_node_register: false
        - name: Fail when the invalid input was accepted
          ansible.builtin.fail:
            msg: "negative case panel-source-missing was accepted"
      rescue:
        - name: Record that the invalid input was rejected
          ansible.builtin.set_fact:
            xvpn_negative_rejected: "{{ (xvpn_negative_rejected | default([])) + ['panel-source-missing'] }}"
          when:
            - not (ansible_failed_result.msg | string).startswith('negative case')
            - "'xvpn_node_panel_sources' in (ansible_failed_result.msg | string)"

    # The verify run starts without the facts of the converge: the zone fact comes from the common firewall tasks.
    - name: Load the firewall zone of the converge
      ansible.builtin.include_role:
        name: xvpn.remnawave.common
        tasks_from: firewalld
      vars:
        xvpn_common_firewalld_offline: true

    # xvpn_positive_case: node-name-space
    - name: Positive case node-name-space, the role accepts a node name with a space
      ansible.builtin.include_role:
        name: xvpn.remnawave.node
        public: true
      vars:
        xvpn_node_name: "node one"
        xvpn_node_activate: false
        xvpn_node_register: false
        xvpn_common_firewalld_offline: true

    - name: Assert the computed defaults for a node name with a space
      ansible.builtin.assert:
        that:
          - xvpn_node_inbound_tag == 'vless-reality-node-one'
          - xvpn_node_inbound_tag is match('^[A-Za-z0-9_.-]{1,64}$')
          - xvpn_node_profile_name == 'node one'
        fail_msg: "default inbound tag is '{{ xvpn_node_inbound_tag }}'"
        quiet: true
      vars:
        xvpn_node_name: "node one"

    # D-11: files that are not part of the selected source are removed by the next run.
    - name: Create a stray file on the decoy site
      ansible.builtin.copy:
        content: "stray\n"
        dest: /var/lib/xvpn/rw-edge/decoy/site/stray.txt
        mode: "0644"

    - name: Create the stray sub-directory with a file
      ansible.builtin.file:
        path: /var/lib/xvpn/rw-edge/decoy/site/old
        state: directory
        mode: "0755"

    - name: Put a file into the stray sub-directory
      ansible.builtin.copy:
        content: "stray\n"
        dest: /var/lib/xvpn/rw-edge/decoy/site/old/x.html
        mode: "0644"

    - name: Run the edge role again with the node decoy variables
      ansible.builtin.include_role:
        name: xvpn.remnawave.edge
      vars:
        xvpn_edge_activate: false
        xvpn_edge_https_address: "127.0.0.1:8443"
        xvpn_edge_acme_ca: staging
        xvpn_edge_decoy_select_key: "{{ xvpn_node_domain }}"
        xvpn_edge_decoy_strict: true

    - name: Stat the strays and a template file
      ansible.builtin.stat:
        path: "/var/lib/xvpn/rw-edge/decoy/site/{{ item }}"
      loop: [stray.txt, old, old/x.html, 404.html]
      register: xvpn_verify_decoy_prune

    - name: Assert the strays are gone and the template files are still there
      ansible.builtin.assert:
        that:
          - not xvpn_verify_decoy_prune.results[0].stat.exists
          - not xvpn_verify_decoy_prune.results[1].stat.exists
          - not xvpn_verify_decoy_prune.results[2].stat.exists
          - xvpn_verify_decoy_prune.results[3].stat.exists
        fail_msg: "a stray file survived the decoy prune or a template file was removed"
        quiet: true

    # D-10 order independence: the same list reversed (role params beat role vars) selects the same template.
    - name: Apply the edge role with the template list reversed
      ansible.builtin.include_tasks: ../shared/node_decoy_variant.yml
      vars:
        xvpn_verify_variant:
          templates: "{{ xvpn_verify_templates_all | reverse | list }}"

    - name: Assert the reversed list selected the same template
      ansible.builtin.assert:
        that:
          - xvpn_verify_last.css == xvpn_verify_decoy_role_css.stat.checksum
        fail_msg: "the template choice depends on the list order"
        quiet: true

    # Review round 1: every bundled template is proven, not only the hash-selected one.
    - name: Apply the edge role with each bundled template chosen explicitly
      ansible.builtin.include_tasks: ../shared/node_decoy_each.yml
      loop: "{{ xvpn_verify_template_names }}"
      loop_control:
        loop_var: xvpn_verify_name

    - name: Stat the role style sheet of every bundled template on the controller
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../../roles/edge/files/decoy-templates/{{ item }}/assets/style.css"
        checksum_algorithm: sha256
      loop: "{{ xvpn_verify_template_names }}"
      delegate_to: localhost
      become: false
      register: xvpn_verify_each_role_css

    - name: Assert every template rendered its own site with the strict 404
      ansible.builtin.assert:
        that:
          - xvpn_verify_each | map(attribute='css') | list == xvpn_verify_each_role_css.results | map(attribute='stat') | map(attribute='checksum') | list
          - xvpn_verify_each | map(attribute='css') | unique | length == 4
          - xvpn_verify_each | map(attribute='ok') | min
        fail_msg: "a bundled template did not render: {{ xvpn_verify_each }}"
        quiet: true

    - name: Apply the edge role with an explicit template that the hash would not pick
      ansible.builtin.include_tasks: ../shared/node_decoy_variant.yml
      vars:
        xvpn_verify_variant:
          template: blog

    - name: Assert the explicit choice won over the hash
      ansible.builtin.assert:
        that:
          - xvpn_verify_decoy_expected.stdout != 'blog'
          - xvpn_verify_last.css == (xvpn_verify_each | selectattr('name', 'equalto', 'blog') | first).css
        fail_msg: "the explicit xvpn_edge_decoy_template did not win over the hash"
        quiet: true

    # D-11: an operator directory replaces the template, switching back restores it.
    - name: Create the operator directory on the controller
      ansible.builtin.tempfile:
        state: directory
        prefix: xvpn-decoy-src-
      delegate_to: localhost
      become: false
      register: xvpn_verify_operator_dir

    - name: Fill the operator directory
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ xvpn_verify_operator_dir.path }}/{{ item.name }}"
        mode: "0644"
      loop:
        - {name: index.html, content: "<html><body>operator home</body></html>\n"}
        - {name: 404.html, content: "<html><body>operator missing</body></html>\n"}
      delegate_to: localhost
      become: false

    - name: Apply the edge role with the operator directory
      ansible.builtin.include_tasks: ../shared/node_decoy_variant.yml
      vars:
        xvpn_verify_variant:
          src: "{{ xvpn_verify_operator_dir.path }}"

    - name: Assert the site holds exactly the operator files
      ansible.builtin.assert:
        that:
          - xvpn_verify_last.files == ['404.html', 'index.html']
          - "'operator home' in xvpn_verify_last.index"
        fail_msg: "the operator directory did not replace the template: {{ xvpn_verify_last.files }}"
        quiet: true

    - name: Apply the edge role without the operator directory again
      ansible.builtin.include_tasks: ../shared/node_decoy_variant.yml
      vars:
        xvpn_verify_variant: {}

    - name: Assert the template is back
      ansible.builtin.assert:
        that:
          - xvpn_verify_last.css == xvpn_verify_decoy_role_css.stat.checksum
          - "'assets/style.css' in xvpn_verify_last.files"
        fail_msg: "the template was not restored: {{ xvpn_verify_last.files }}"
        quiet: true

    - name: Remove the operator directory
      ansible.builtin.file:
        path: "{{ xvpn_verify_operator_dir.path }}"
        state: absent
      delegate_to: localhost
      become: false

    # T-03-09: the brand is HTML-escaped.
    - name: Apply the edge role with an HTML brand
      ansible.builtin.include_tasks: ../shared/node_decoy_variant.yml
      vars:
        xvpn_verify_variant:
          brand: "<b>Acme</b>"

    - name: Assert the brand is escaped
      ansible.builtin.assert:
        that:
          - "'&lt;b&gt;Acme&lt;/b&gt;' in xvpn_verify_last.index"
          - "'<b>Acme</b>' not in xvpn_verify_last.index"
        fail_msg: "the brand is not escaped in index.html"
        quiet: true

    # xvpn_negative_case: decoy-template-unknown
    - name: Negative case decoy-template-unknown
      block:
        - name: Run the edge role with an unknown decoy template
          ansible.builtin.include_role:
            name: xvpn.remnawave.edge
          vars:
            xvpn_edge_decoy_template: unknown
            xvpn_edge_activate: false
        - name: Fail when the invalid input was accepted
          ansible.builtin.fail:
            msg: "negative case decoy-template-unknown was accepted"
      rescue:
        - name: Record that the invalid input was rejected
          ansible.builtin.set_fact:
            xvpn_negative_rejected: "{{ (xvpn_negative_rejected | default([])) + ['decoy-template-unknown'] }}"
          when:
            - not (ansible_failed_result.msg | string).startswith('negative case')
            - "'xvpn_edge_decoy_template' in (ansible_failed_result.msg | string)"

    # Restore the default selection so the scenario state matches the converge.
    - name: Apply the edge role with the default node selection
      ansible.builtin.include_tasks: ../shared/node_decoy_variant.yml
      vars:
        xvpn_verify_variant: {}

    - name: Assert the default selection is back
      ansible.builtin.assert:
        that:
          - xvpn_verify_last.css == xvpn_verify_decoy_role_css.stat.checksum
        fail_msg: "the default decoy selection was not restored"
        quiet: true

    - name: List the dynamic directory after the node cases
      ansible.builtin.find:
        paths: /var/lib/xvpn/rw-edge/traefik/dynamic
        get_checksum: true
      register: xvpn_verify_dyn_after

    - name: Assert no route file changed or appeared
      ansible.builtin.assert:
        that:
          - (xvpn_verify_dyn_before.files | map(attribute='path') | zip(xvpn_verify_dyn_before.files | map(attribute='checksum')) | list | sort)
            == (xvpn_verify_dyn_after.files | map(attribute='path') | zip(xvpn_verify_dyn_after.files | map(attribute='checksum')) | list | sort)
        fail_msg: "the dynamic directory changed during the negative cases"
        quiet: true

    - name: Assert every node negative case was rejected with the variable name
      ansible.builtin.assert:
        that:
          - xvpn_negative_rejected | sort == xvpn_negative_expected | sort
        fail_msg: "rejected {{ xvpn_negative_rejected | default([]) | sort }}, expected {{ xvpn_negative_expected | sort }}"
        quiet: true

    - name: Stat the remnanode env files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /var/lib/xvpn/rw-node/env/runtime.env
        - /var/lib/xvpn/rw-node/env/node.env
      register: xvpn_verify_node_envs

    - name: Read runtime.env
      ansible.builtin.slurp:
        src: /var/lib/xvpn/rw-node/env/runtime.env
      register: xvpn_verify_node_runtime_env

    - name: Assert runtime.env carries NODE_PORT and node.env is absent (register false)
      ansible.builtin.assert:
        that:
          - xvpn_verify_node_envs.results[0].stat.exists
          - xvpn_verify_node_envs.results[0].stat.mode == '0600'
          - xvpn_verify_node_envs.results[0].stat.pw_name == 'rw-node'
          - (xvpn_verify_node_runtime_env.content | b64decode) is search('(?m)^NODE_PORT=2222$')
          - not xvpn_verify_node_envs.results[1].stat.exists
        fail_msg: "runtime.env / node.env state is wrong in the container tier"
        quiet: true
