---
# VM tier (QA-03): real EL10 VMs with SELinux enforcing, real user manager and firewalld.
# Boxes are versioned and sha256-pinned (T-01-19); never point box_url at a moving "latest" symlink.
# The community.vagrant option names are box_download_checksum / box_download_checksum_type.
driver:
  name: vagrant
  provider:
    name: libvirt
platforms:
  - name: alma10
    # Vagrant Cloud catalog mode, version pinned. A direct vagrantcloud.com box_url cannot be used: its first
    # redirect answers with Content-Type: application/json, so Vagrant parses the box as catalog metadata and
    # fails with "metadata for the box was malformed". In catalog mode Vagrant verifies the sha256 published
    # in the catalog for this exact version and provider (libvirt/amd64):
    # 24b3ff7cd6810e5bf63614ab5c31496cb5496c329c3074ad29885ab370e2f9c1 (compare when bumping the version).
    box: almalinux/10
    box_version: 10.2.20260914
    box_architecture: amd64
    memory: 4096
    cpus: 2
    # Rocky/Alma 10 need x86-64-v3 (RESEARCH Pitfall 10)
    provider_options:
      cpu_mode: host-passthrough
  - name: rocky10
    # Official Rocky box; the Vagrant Cloud rockylinux/10 box is stale (D-18, PROJECT.md Key Decision).
    # Checksum from the CHECKSUM file next to the image on dl.rockylinux.org.
    box: rocky10-libvirt-10.3-20261112.0
    box_url: https://dl.rockylinux.org/pub/rocky/10/images/x86_64/Rocky-10-Vagrant-Libvirt-10.3-20261112.0.x86_64.vagrant.libvirt.box
    box_download_checksum: 491cf68af9e485bdd9317051ccfeb68301e86d04476a15b5cfd065d0bd7159ea
    box_download_checksum_type: sha256
    box_architecture: amd64
    memory: 4096
    cpus: 2
    provider_options:
      cpu_mode: host-passthrough
ansible:
  executor:
    backend: ansible-playbook
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - destroy
