---
- name: Prepare VM platforms (auditd, dontaudit off and proven, AVC marker)
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Install auditd and the SELinux policy inspection tools
      ansible.builtin.dnf:
        name:
          - audit
          - setools-console
          - policycoreutils-python-utils
        state: present

    # Installing the SELinux policy packages the role needs rebuilds the policy and re-enables dontaudit
    # rules, so they must be present before `semodule -DB` and the AVC marker (Plan 11 pre-decided fix).
    - name: Install the SELinux policy packages the role would install
      ansible.builtin.dnf:
        name: container-selinux
        state: present

    - name: Look up passt-selinux in the enabled repositories
      ansible.builtin.command: dnf -q repoquery --available passt-selinux
      register: xvpn_prepare_passt_selinux
      changed_when: false

    - name: Install passt-selinux when it is offered
      ansible.builtin.dnf:
        name: passt-selinux
        state: present
      when: xvpn_prepare_passt_selinux.stdout | trim | length > 0

    - name: Enable and start auditd
      ansible.builtin.systemd_service:
        name: auditd.service
        enabled: true
        state: started

    - name: Capture SELinux policy diagnostics (informational, no assertion)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          seinfo --version; sestatus; ls -l /etc/selinux/targeted/policy/ /sys/fs/selinux/policy
          semanage port -l | grep -Ew '80|443|3000|3010|14000|18080'
      register: xvpn_prepare_selinux_diag
      changed_when: false
      failed_when: false

    - name: Show SELinux policy diagnostics
      ansible.builtin.debug:
        var: xvpn_prepare_selinux_diag.stdout_lines

    # Positive control: seinfo must see dontaudit rules before they are disabled,
    # otherwise a later "0" would prove nothing (B-2).
    - name: Read the loaded policy statistics before disabling dontaudit
      ansible.builtin.command: seinfo
      register: xvpn_prepare_seinfo_before
      changed_when: false

    - name: Assert the dontaudit probe sees dontaudit rules
      ansible.builtin.assert:
        that:
          - xvpn_prepare_seinfo_before.stdout is regex('(?m)(?:^|\s)Dontaudit:\s+[0-9]+')
          - (xvpn_prepare_seinfo_before.stdout | regex_findall('(?m)(?:^|\s)Dontaudit:\s+([0-9]+)') | first | int) > 0
        fail_msg: |-
          seinfo reports no dontaudit rules before the dontaudit disable; the dontaudit probe is not trustworthy
          {{ xvpn_prepare_seinfo_before.stdout }}
        quiet: true

    - name: Disable dontaudit rules and rebuild the policy
      ansible.builtin.command: semodule -DB
      changed_when: true

    - name: Read the loaded policy statistics after disabling dontaudit
      ansible.builtin.command: seinfo
      register: xvpn_prepare_seinfo_after
      changed_when: false

    - name: Assert no dontaudit rules are loaded
      ansible.builtin.assert:
        that:
          - xvpn_prepare_seinfo_after.stdout is regex('(?m)(?:^|\s)Dontaudit:\s+[0-9]+')
          - (xvpn_prepare_seinfo_after.stdout | regex_findall('(?m)(?:^|\s)Dontaudit:\s+([0-9]+)') | first | int) == 0
        fail_msg: |-
          dontaudit rules still loaded after the dontaudit disable
          {{ xvpn_prepare_seinfo_after.stdout }}
        quiet: true

    - name: Install Pebble and the mock DNS server (test CA for HTTP-01, QA-05)
      ansible.builtin.include_tasks: tasks/pebble.yml

    - name: Create the molecule state directory
      ansible.builtin.file:
        path: /var/lib/xvpn-molecule
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Check for an existing AVC marker
      ansible.builtin.stat:
        path: /var/lib/xvpn-molecule/avc_marker
      register: xvpn_prepare_marker

    # ausearch -ts parses with the C-locale %x/%X formats (two-digit year); a 4-digit year is rejected.
    # Written only once per VM instance so re-runs keep the original window start.
    - name: Record the AVC marker
      ansible.builtin.shell:
        cmd: set -o pipefail; LC_ALL=C date '+%x %X' > /var/lib/xvpn-molecule/avc_marker && chmod 0600 /var/lib/xvpn-molecule/avc_marker
        executable: /bin/bash
      changed_when: true
      when: not xvpn_prepare_marker.stat.exists
