---
# Real playbooks/panel.yml on the enforcing VM: real firewalld, real user manager, Pebble as the ACME CA.
# include_vars persists for the host across the imported plays and is reused by side_effect.yml.
- name: Load the VM-tier Panel values
  hosts: all
  gather_facts: false
  tasks:
    - name: Load vars/panel.yml
      ansible.builtin.include_vars: vars/panel.yml

- name: Panel host
  ansible.builtin.import_playbook: ../../../playbooks/panel.yml
  vars:
    ansible_pipelining: true

- name: Record the traefik unit invocation
  hosts: all
  become: true
  vars:
    ansible_pipelining: true
  tasks:
    - name: Read the uid of the service user
      ansible.builtin.getent:
        database: passwd
        key: rw-edge

    # D-10(c), unchanged-unit half: the first converge records the InvocationID,
    # the idempotence re-run must leave it unchanged (checked in side_effect.yml).
    - name: Read the InvocationID of the traefik unit
      ansible.builtin.command:
        argv:
          - systemctl
          - --user
          - show
          - -p
          - InvocationID
          - --value
          - traefik.service
      become: true
      become_user: rw-edge
      become_method: ansible.builtin.sudo
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd']['rw-edge'][1] }}"
      register: xvpn_converge_invocation
      changed_when: false
      check_mode: false

    - name: Assert the traefik unit has an invocation
      ansible.builtin.assert:
        that:
          - xvpn_converge_invocation.stdout | trim | length > 0
        fail_msg: "traefik.service has no InvocationID after the converge; the unit did not start"
        quiet: true

    - name: Record the InvocationID after the first converge
      ansible.builtin.copy:
        content: "{{ xvpn_converge_invocation.stdout | trim }}\n"
        dest: /var/lib/xvpn-molecule/invocation_after_first_converge
        owner: root
        group: root
        mode: "0600"
        force: false
