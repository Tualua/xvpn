---
- name: Reboot the VM and re-prove the runtime (FND-04)
  hosts: all
  become: true
  gather_facts: true
  vars:
    ansible_pipelining: true
  tasks:
    # getent_passwd is one fact that each lookup replaces, so each uid is kept in its own fact.
    - name: Read the uid of the service user
      ansible.builtin.getent:
        database: passwd
        key: rw-edge

    - name: Remember the uid of the service user
      ansible.builtin.set_fact:
        xvpn_side_effect_edge_uid: "{{ ansible_facts['getent_passwd']['rw-edge'][1] }}"

    - name: Read the uid of the Panel service user
      ansible.builtin.getent:
        database: passwd
        key: rw-panel

    - name: Remember the uid of the Panel service user
      ansible.builtin.set_fact:
        xvpn_side_effect_panel_uid: "{{ ansible_facts['getent_passwd']['rw-panel'][1] }}"

    - name: Set the user manager runtime directory
      ansible.builtin.set_fact:
        xvpn_side_effect_env:
          XDG_RUNTIME_DIR: "/run/user/{{ xvpn_side_effect_edge_uid }}"

    # D-10(c), unchanged-unit half: the idempotence re-run must not have restarted the unit.
    # Compared BEFORE this file restarts it on purpose.
    - name: Read the InvocationID recorded after the first converge
      ansible.builtin.slurp:
        src: /var/lib/xvpn-molecule/invocation_after_first_converge
      register: xvpn_side_effect_recorded

    - name: Read the current InvocationID of the traefik unit
      ansible.builtin.command:
        argv:
          - systemctl
          - --user
          - show
          - -p
          - InvocationID
          - --value
          - traefik.service
      become: true
      become_user: rw-edge
      become_method: ansible.builtin.sudo
      environment: "{{ xvpn_side_effect_env }}"
      register: xvpn_side_effect_current
      changed_when: false

    - name: Assert the idempotence re-run left the unchanged unit alone
      ansible.builtin.assert:
        that:
          - (xvpn_side_effect_recorded.content | b64decode | trim) | length > 0
          - xvpn_side_effect_current.stdout | trim | length > 0
          - (xvpn_side_effect_recorded.content | b64decode | trim) == (xvpn_side_effect_current.stdout | trim)
        fail_msg: "the idempotence re-run restarted the unchanged unit traefik.service (D-10 condition c)"
        quiet: true

    - name: Read the backend InvocationID recorded after the first converge
      ansible.builtin.slurp:
        src: /var/lib/xvpn-molecule/invocation_backend_after_first_converge
      register: xvpn_side_effect_backend_recorded

    - name: Read the current InvocationID of the backend unit
      ansible.builtin.command:
        argv:
          - systemctl
          - --user
          - show
          - -p
          - InvocationID
          - --value
          - remnawave.service
      become: true
      become_user: rw-panel
      become_method: ansible.builtin.sudo
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ xvpn_side_effect_panel_uid }}"
      register: xvpn_side_effect_backend_current
      changed_when: false

    - name: Assert the idempotence re-run left the backend unit alone
      ansible.builtin.assert:
        that:
          - (xvpn_side_effect_backend_recorded.content | b64decode | trim) | length > 0
          - (xvpn_side_effect_backend_recorded.content | b64decode | trim) == (xvpn_side_effect_backend_current.stdout | trim)
        fail_msg: "the idempotence re-run restarted the unchanged unit remnawave.service (PANEL-02)"
        quiet: true

    - name: Verify the Panel stack before the reboot
      ansible.builtin.include_tasks: ../shared/verify_panel.yml

    # PANEL-04 / T-02-19: a lost token heals on the next run, the old one is revoked and exactly one token of the
    # name remains. All token handling is no_log. The second part proves a divergent admin password fails early.
    - name: Token recovery | start the clock
      ansible.builtin.command:
        argv:
          - date
          - +%s
      register: xvpn_se_tr_start
      changed_when: false

    - name: Token recovery | load the VM-tier Panel values
      ansible.builtin.include_vars: vars/panel.yml

    - name: Token recovery | read the current token
      ansible.builtin.slurp:
        src: /var/lib/xvpn/rw-panel/secrets/api-token
      register: xvpn_se_tr_old
      no_log: true

    - name: Token recovery | read the checksum recorded after the first converge
      ansible.builtin.slurp:
        src: /var/lib/xvpn-molecule/token_checksum_after_first_converge
      register: xvpn_se_tr_recorded

    - name: Token recovery | delete the token file
      ansible.builtin.file:
        path: /var/lib/xvpn/rw-panel/secrets/api-token
        state: absent

    - name: Token recovery | re-run the Panel role
      ansible.builtin.include_role:
        name: xvpn.remnawave.panel

    - name: Token recovery | stat the recreated token file
      ansible.builtin.stat:
        path: /var/lib/xvpn/rw-panel/secrets/api-token
        checksum_algorithm: sha256
      register: xvpn_se_tr_new_stat

    - name: Token recovery | assert the new token file differs from the first one
      ansible.builtin.assert:
        that:
          - xvpn_se_tr_new_stat.stat.exists
          - xvpn_se_tr_new_stat.stat.pw_name == 'rw-panel'
          - xvpn_se_tr_new_stat.stat.mode == '0600'
          - xvpn_se_tr_new_stat.stat.checksum != (xvpn_se_tr_recorded.content | b64decode | trim)
        fail_msg: "the token file was not recreated with a new content, owner rw-panel and mode 0600"
        quiet: true

    - name: Token recovery | read the new token
      ansible.builtin.slurp:
        src: /var/lib/xvpn/rw-panel/secrets/api-token
      register: xvpn_se_tr_new
      no_log: true

    - name: Token recovery | the new token is accepted
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/api/nodes
        headers:
          X-Forwarded-For: 127.0.0.1
          X-Forwarded-Proto: https
          Authorization: "Bearer {{ xvpn_se_tr_new.content | b64decode | trim }}"
        status_code: 200
      changed_when: false
      no_log: true

    - name: Token recovery | the old token is rejected
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/api/nodes
        headers:
          X-Forwarded-For: 127.0.0.1
          X-Forwarded-Proto: https
          Authorization: "Bearer {{ xvpn_se_tr_old.content | b64decode | trim }}"
        status_code: [401, 403]
      changed_when: false
      no_log: true

    - name: Token recovery | read the stored admin credentials
      ansible.builtin.slurp:
        src: /var/lib/xvpn/rw-panel/secrets/panel-secrets.yml
      register: xvpn_se_tr_secrets
      no_log: true

    - name: Token recovery | log in with a fresh session
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/api/auth/login
        method: POST
        headers:
          X-Forwarded-For: 127.0.0.1
          X-Forwarded-Proto: https
        body_format: json
        body:
          username: rwoperator
          password: "{{ (xvpn_se_tr_secrets.content | b64decode | from_yaml).admin_password }}"
        return_content: true
        status_code: [200, 201]
      register: xvpn_se_tr_login
      changed_when: false
      no_log: true

    - name: Token recovery | list the tokens
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/api/tokens
        headers:
          X-Forwarded-For: 127.0.0.1
          X-Forwarded-Proto: https
          X-Remnawave-Client-Type: browser
          Authorization: "Bearer {{ xvpn_se_tr_login.json.response.accessToken }}"
        return_content: true
        status_code: 200
      register: xvpn_se_tr_list
      changed_when: false
      no_log: true

    - name: Token recovery | assert exactly one token of the name exists
      ansible.builtin.assert:
        that:
          - xvpn_se_tr_list.json.response.tokens | selectattr('name', 'equalto', 'xvpn-automation') | list | length == 1
        fail_msg: "expected exactly one API token named xvpn-automation"
        quiet: true

    - name: Token recovery | re-run the Panel role once more
      ansible.builtin.include_role:
        name: xvpn.remnawave.panel

    - name: Token recovery | stat the token file after the converged run
      ansible.builtin.stat:
        path: /var/lib/xvpn/rw-panel/secrets/api-token
        checksum_algorithm: sha256
      register: xvpn_se_tr_again_stat

    - name: Token recovery | assert the recovery converged
      ansible.builtin.assert:
        that:
          - xvpn_se_tr_again_stat.stat.checksum == xvpn_se_tr_new_stat.stat.checksum
        fail_msg: "the token file changed on the run after the recovery"
        quiet: true

    # The post-reboot verify.yml compares against the recovered token.
    - name: Token recovery | record the recovered token checksum
      ansible.builtin.copy:
        content: "{{ xvpn_se_tr_new_stat.stat.checksum }}\n"
        dest: /var/lib/xvpn-molecule/token_checksum_after_first_converge
        owner: root
        group: root
        mode: "0600"
        force: true

    # A policy-valid admin password that differs from the stored one fails before any HTTP call (D-10).
    - name: Token recovery | a divergent admin password is rejected
      block:
        - name: Token recovery | run the Panel role with a different admin password
          ansible.builtin.include_role:
            name: xvpn.remnawave.panel
          vars:
            xvpn_panel_admin_password: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=30) }}"

        - name: Token recovery | the divergent run must not succeed
          ansible.builtin.set_fact:
            xvpn_se_tr_divergent_rejected: false
      rescue:
        - name: Token recovery | record that the divergent run failed
          ansible.builtin.set_fact:
            xvpn_se_tr_divergent_rejected: "{{ 'admin_password' in (ansible_failed_result.msg | default('')) }}"

    - name: Token recovery | assert the divergent password failed naming the key
      ansible.builtin.assert:
        that:
          - xvpn_se_tr_divergent_rejected | bool
        fail_msg: "a divergent admin password was not rejected with a message naming admin_password"
        quiet: true

    - name: Token recovery | log in with the stored password again
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/api/auth/login
        method: POST
        headers:
          X-Forwarded-For: 127.0.0.1
          X-Forwarded-Proto: https
        body_format: json
        body:
          username: rwoperator
          password: "{{ (xvpn_se_tr_secrets.content | b64decode | from_yaml).admin_password }}"
        status_code: [200, 201]
      changed_when: false
      no_log: true

    - name: Token recovery | stop the clock
      ansible.builtin.command:
        argv:
          - date
          - +%s
      register: xvpn_se_tr_end
      changed_when: false

    - name: Token recovery | report the duration
      ansible.builtin.debug:
        msg: "Token recovery block took {{ (xvpn_se_tr_end.stdout | int) - (xvpn_se_tr_start.stdout | int) }} s"

    - name: Verify the rootless plumbing and the bind probes before the reboot
      ansible.builtin.include_tasks: ../shared/verify_rootless.yml
      vars:
        # Traefik holds :80 and :443; :81 is above the sysctl floor (80), the :79 negative control is unchanged.
        xvpn_verify_bind_probe_ports: [81]
        xvpn_verify_quadlet_unit: traefik.container

    - name: Verify the host baseline before the reboot
      ansible.builtin.include_tasks: ../shared/verify_common.yml
      vars:
        xvpn_verify_expected_ports: ["80/tcp", "443/tcp"]

    # A bare-IP request on :80 carries no known Host, so Traefik answers 404 (D-15).
    - name: Verify the runtime before the reboot
      ansible.builtin.include_tasks: ../shared/verify_runtime.yml
      vars:
        xvpn_verify_unit: traefik.service
        xvpn_verify_port: 80
        xvpn_verify_http_status: 404

    - name: Verify the edge before the reboot
      ansible.builtin.include_tasks: ../shared/verify_edge.yml
      vars:
        xvpn_verify_edge_domain: panel.xvpn.test

    # PANEL-05, PANEL-06: the gate matrix and, once, the gate rotation (D-06); the rotation re-points the recorded
    # secrets checksum, so the post-reboot verify_panel.yml compares against the rotated file.
    - name: Verify the Panel gate before the reboot
      ansible.builtin.include_tasks: ../shared/verify_gate.yml
      vars:
        xvpn_verify_gate_rotation: true

    # SC2: Ansible controls the user unit through systemctl --user, not only observes it.
    - name: Read the InvocationID before the restart
      ansible.builtin.command:
        argv:
          - systemctl
          - --user
          - show
          - -p
          - InvocationID
          - --value
          - traefik.service
      become: true
      become_user: rw-edge
      become_method: ansible.builtin.sudo
      environment: "{{ xvpn_side_effect_env }}"
      register: xvpn_side_effect_before
      changed_when: false

    - name: Restart the traefik unit in the user manager
      ansible.builtin.systemd_service:
        name: traefik.service
        scope: user
        state: restarted
      become: true
      become_user: rw-edge
      become_method: ansible.builtin.sudo
      environment: "{{ xvpn_side_effect_env }}"

    - name: Read the InvocationID after the restart
      ansible.builtin.command:
        argv:
          - systemctl
          - --user
          - show
          - -p
          - InvocationID
          - --value
          - traefik.service
      become: true
      become_user: rw-edge
      become_method: ansible.builtin.sudo
      environment: "{{ xvpn_side_effect_env }}"
      register: xvpn_side_effect_after
      changed_when: false

    - name: Assert the restart created a new invocation
      ansible.builtin.assert:
        that:
          - xvpn_side_effect_after.stdout | trim | length > 0
          - xvpn_side_effect_after.stdout | trim != xvpn_side_effect_before.stdout | trim
        fail_msg: "systemctl --user restart did not create a new invocation"
        quiet: true

    - name: Verify the runtime after the restart
      ansible.builtin.include_tasks: ../shared/verify_runtime.yml
      vars:
        xvpn_verify_unit: traefik.service
        xvpn_verify_port: 80
        xvpn_verify_http_status: 404

    # B-2 boot window: remember the binary policy that was just proven dontaudit-free.
    - name: Find the binary policy files before the reboot
      ansible.builtin.find:
        paths: /etc/selinux/targeted/policy
        patterns: "policy.*"
      register: xvpn_side_effect_policy_files

    - name: Assert a binary policy file exists
      ansible.builtin.assert:
        that:
          - xvpn_side_effect_policy_files.files | length > 0
        fail_msg: "no /etc/selinux/targeted/policy/policy.* file found"
        quiet: true

    - name: Checksum the newest binary policy file
      ansible.builtin.stat:
        path: "{{ (xvpn_side_effect_policy_files.files | sort(attribute='mtime') | last).path }}"
        checksum_algorithm: sha256
      register: xvpn_side_effect_policy_stat

    - name: Record the binary policy checksum before the reboot
      ansible.builtin.copy:
        content: "{{ xvpn_side_effect_policy_stat.stat.path }} {{ xvpn_side_effect_policy_stat.stat.checksum }}\n"
        dest: /var/lib/xvpn-molecule/policy_before_reboot
        owner: root
        group: root
        mode: "0600"

    - name: Reboot the VM
      ansible.builtin.reboot:
        reboot_timeout: 900

    - name: Wait for the traefik unit in the user manager after the reboot
      ansible.builtin.command:
        argv:
          - systemctl
          - --user
          - is-active
          - traefik.service
      become: true
      become_user: rw-edge
      become_method: ansible.builtin.sudo
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ xvpn_side_effect_edge_uid }}"
      register: xvpn_side_effect_post_reboot
      until: xvpn_side_effect_post_reboot.stdout | trim == 'active'
      retries: 60
      delay: 10
      changed_when: false
