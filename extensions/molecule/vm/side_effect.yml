---
- name: Reboot the VM and re-prove the runtime (FND-04)
  hosts: all
  become: true
  gather_facts: true
  vars:
    ansible_pipelining: true
  tasks:
    # getent_passwd is one fact that each lookup replaces, so each uid is kept in its own fact.
    - name: Read the uid of the service user
      ansible.builtin.getent:
        database: passwd
        key: rw-edge

    - name: Remember the uid of the service user
      ansible.builtin.set_fact:
        xvpn_side_effect_edge_uid: "{{ ansible_facts['getent_passwd']['rw-edge'][1] }}"

    - name: Read the uid of the Panel service user
      ansible.builtin.getent:
        database: passwd
        key: rw-panel

    - name: Remember the uid of the Panel service user
      ansible.builtin.set_fact:
        xvpn_side_effect_panel_uid: "{{ ansible_facts['getent_passwd']['rw-panel'][1] }}"

    - name: Set the user manager runtime directory
      ansible.builtin.set_fact:
        xvpn_side_effect_env:
          XDG_RUNTIME_DIR: "/run/user/{{ xvpn_side_effect_edge_uid }}"

    # D-10(c), unchanged-unit half: the idempotence re-run must not have restarted the unit.
    # Compared BEFORE this file restarts it on purpose.
    - name: Read the InvocationID recorded after the first converge
      ansible.builtin.slurp:
        src: /var/lib/xvpn-molecule/invocation_after_first_converge
      register: xvpn_side_effect_recorded

    - name: Read the current InvocationID of the traefik unit
      ansible.builtin.command:
        argv:
          - systemctl
          - --user
          - show
          - -p
          - InvocationID
          - --value
          - traefik.service
      become: true
      become_user: rw-edge
      become_method: ansible.builtin.sudo
      environment: "{{ xvpn_side_effect_env }}"
      register: xvpn_side_effect_current
      changed_when: false

    - name: Assert the idempotence re-run left the unchanged unit alone
      ansible.builtin.assert:
        that:
          - (xvpn_side_effect_recorded.content | b64decode | trim) | length > 0
          - xvpn_side_effect_current.stdout | trim | length > 0
          - (xvpn_side_effect_recorded.content | b64decode | trim) == (xvpn_side_effect_current.stdout | trim)
        fail_msg: "the idempotence re-run restarted the unchanged unit traefik.service (D-10 condition c)"
        quiet: true

    - name: Read the backend InvocationID recorded after the first converge
      ansible.builtin.slurp:
        src: /var/lib/xvpn-molecule/invocation_backend_after_first_converge
      register: xvpn_side_effect_backend_recorded

    - name: Read the current InvocationID of the backend unit
      ansible.builtin.command:
        argv:
          - systemctl
          - --user
          - show
          - -p
          - InvocationID
          - --value
          - remnawave.service
      become: true
      become_user: rw-panel
      become_method: ansible.builtin.sudo
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ xvpn_side_effect_panel_uid }}"
      register: xvpn_side_effect_backend_current
      changed_when: false

    - name: Assert the idempotence re-run left the backend unit alone
      ansible.builtin.assert:
        that:
          - (xvpn_side_effect_backend_recorded.content | b64decode | trim) | length > 0
          - (xvpn_side_effect_backend_recorded.content | b64decode | trim) == (xvpn_side_effect_backend_current.stdout | trim)
        fail_msg: "the idempotence re-run restarted the unchanged unit remnawave.service (PANEL-02)"
        quiet: true

    - name: Verify the Panel stack before the reboot
      ansible.builtin.include_tasks: ../shared/verify_panel.yml

    - name: Verify the rootless plumbing and the bind probes before the reboot
      ansible.builtin.include_tasks: ../shared/verify_rootless.yml
      vars:
        # Traefik holds :80 and :443; :81 is above the sysctl floor (80), the :79 negative control is unchanged.
        xvpn_verify_bind_probe_ports: [81]
        xvpn_verify_quadlet_unit: traefik.container

    - name: Verify the host baseline before the reboot
      ansible.builtin.include_tasks: ../shared/verify_common.yml
      vars:
        xvpn_verify_expected_ports: ["80/tcp", "443/tcp"]

    # A bare-IP request on :80 carries no known Host, so Traefik answers 404 (D-15).
    - name: Verify the runtime before the reboot
      ansible.builtin.include_tasks: ../shared/verify_runtime.yml
      vars:
        xvpn_verify_unit: traefik.service
        xvpn_verify_port: 80
        xvpn_verify_http_status: 404

    - name: Verify the edge before the reboot
      ansible.builtin.include_tasks: ../shared/verify_edge.yml
      vars:
        xvpn_verify_edge_domain: panel.xvpn.test

    # SC2: Ansible controls the user unit through systemctl --user, not only observes it.
    - name: Read the InvocationID before the restart
      ansible.builtin.command:
        argv:
          - systemctl
          - --user
          - show
          - -p
          - InvocationID
          - --value
          - traefik.service
      become: true
      become_user: rw-edge
      become_method: ansible.builtin.sudo
      environment: "{{ xvpn_side_effect_env }}"
      register: xvpn_side_effect_before
      changed_when: false

    - name: Restart the traefik unit in the user manager
      ansible.builtin.systemd_service:
        name: traefik.service
        scope: user
        state: restarted
      become: true
      become_user: rw-edge
      become_method: ansible.builtin.sudo
      environment: "{{ xvpn_side_effect_env }}"

    - name: Read the InvocationID after the restart
      ansible.builtin.command:
        argv:
          - systemctl
          - --user
          - show
          - -p
          - InvocationID
          - --value
          - traefik.service
      become: true
      become_user: rw-edge
      become_method: ansible.builtin.sudo
      environment: "{{ xvpn_side_effect_env }}"
      register: xvpn_side_effect_after
      changed_when: false

    - name: Assert the restart created a new invocation
      ansible.builtin.assert:
        that:
          - xvpn_side_effect_after.stdout | trim | length > 0
          - xvpn_side_effect_after.stdout | trim != xvpn_side_effect_before.stdout | trim
        fail_msg: "systemctl --user restart did not create a new invocation"
        quiet: true

    - name: Verify the runtime after the restart
      ansible.builtin.include_tasks: ../shared/verify_runtime.yml
      vars:
        xvpn_verify_unit: traefik.service
        xvpn_verify_port: 80
        xvpn_verify_http_status: 404

    # B-2 boot window: remember the binary policy that was just proven dontaudit-free.
    - name: Find the binary policy files before the reboot
      ansible.builtin.find:
        paths: /etc/selinux/targeted/policy
        patterns: "policy.*"
      register: xvpn_side_effect_policy_files

    - name: Assert a binary policy file exists
      ansible.builtin.assert:
        that:
          - xvpn_side_effect_policy_files.files | length > 0
        fail_msg: "no /etc/selinux/targeted/policy/policy.* file found"
        quiet: true

    - name: Checksum the newest binary policy file
      ansible.builtin.stat:
        path: "{{ (xvpn_side_effect_policy_files.files | sort(attribute='mtime') | last).path }}"
        checksum_algorithm: sha256
      register: xvpn_side_effect_policy_stat

    - name: Record the binary policy checksum before the reboot
      ansible.builtin.copy:
        content: "{{ xvpn_side_effect_policy_stat.stat.path }} {{ xvpn_side_effect_policy_stat.stat.checksum }}\n"
        dest: /var/lib/xvpn-molecule/policy_before_reboot
        owner: root
        group: root
        mode: "0600"

    - name: Reboot the VM
      ansible.builtin.reboot:
        reboot_timeout: 900

    - name: Wait for the traefik unit in the user manager after the reboot
      ansible.builtin.command:
        argv:
          - systemctl
          - --user
          - is-active
          - traefik.service
      become: true
      become_user: rw-edge
      become_method: ansible.builtin.sudo
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ xvpn_side_effect_edge_uid }}"
      register: xvpn_side_effect_post_reboot
      until: xvpn_side_effect_post_reboot.stdout | trim == 'active'
      retries: 60
      delay: 10
      changed_when: false
