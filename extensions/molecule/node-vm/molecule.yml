---
# Two-VM stand (Phase 3): a Panel VM and a node VM, SELinux enforcing, Pebble as the ACME CA on each VM.
# Box pin as in extensions/molecule/vm/molecule.yml (T-01-19). The workflow matrix selects the OS of a leg through
# XVPN_NODE_VM_BOX* (both VMs of a leg use the same box); the defaults are the AlmaLinux 10 catalog box.
# The VM sizes come from XVPN_NODE_VM_PANEL_MEMORY / XVPN_NODE_VM_NODE_MEMORY (MiB), so the workflow
# memory budget step and Molecule read the same numbers. Floors: Panel 3072, node 1536.
driver:
  name: vagrant
  provider:
    name: libvirt
platforms:
  - name: panel
    box: ${XVPN_NODE_VM_BOX:-almalinux/10}
    box_version: ${XVPN_NODE_VM_BOX_VERSION:-10.2.20260914}
    box_url: ${XVPN_NODE_VM_BOX_URL}
    box_download_checksum: ${XVPN_NODE_VM_BOX_SHA256}
    box_download_checksum_type: sha256
    box_architecture: amd64
    memory: ${XVPN_NODE_VM_PANEL_MEMORY:-4096}
    cpus: 2
    groups: [remnawave_panel]
    # Rocky/Alma 10 need x86-64-v3 (RESEARCH Pitfall 10)
    provider_options:
      cpu_mode: host-passthrough
  - name: node
    box: ${XVPN_NODE_VM_BOX:-almalinux/10}
    box_version: ${XVPN_NODE_VM_BOX_VERSION:-10.2.20260914}
    box_url: ${XVPN_NODE_VM_BOX_URL}
    box_download_checksum: ${XVPN_NODE_VM_BOX_SHA256}
    box_download_checksum_type: sha256
    box_architecture: amd64
    memory: ${XVPN_NODE_VM_NODE_MEMORY:-2048}
    cpus: 2
    groups: [remnawave_nodes]
    provider_options:
      cpu_mode: host-passthrough
ansible:
  executor:
    backend: ansible-playbook
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
