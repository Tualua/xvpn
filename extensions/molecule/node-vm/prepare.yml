---
# Each VM runs its own Pebble and challtestsrv (extensions/molecule/vm/tasks/pebble.yml), so every VM stores its
# own issuer root; a verifier on another VM must copy the root from the VM that issued the certificate.
- name: Prepare both VMs (auditd, AVC marker, Pebble, own test names)
  ansible.builtin.import_playbook: ../vm/prepare.yml
  vars:
    xvpn_prepare_hosts_names: "{{ 'node.xvpn.test' if 'remnawave_nodes' in group_names else 'panel.xvpn.test sub.xvpn.test' }}"

- name: Store the Pebble issuer root on every VM
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Fetch the Pebble issuing root
      ansible.builtin.uri:
        url: https://127.0.0.1:15000/roots/0
        ca_path: /etc/pebble/certs/pebble.minica.pem
        return_content: true
      register: xvpn_prepare_issuer_root

    - name: Write the Pebble issuer root
      ansible.builtin.copy:
        content: "{{ xvpn_prepare_issuer_root.content }}"
        dest: /var/lib/xvpn-molecule/pebble-issuer-root.pem
        owner: root
        group: root
        mode: "0644"

# Both VMs gather facts in this one play before the first lineinfile, so each sees the facts of the other.
# The Panel VM resolves the node name and the node VM resolves the Panel names to the other VM's address;
# each VM's own names were written by vm/tasks/pebble.yml above.
- name: Resolve the names of the other VM
  hosts: all
  become: true
  gather_facts: true
  vars:
    xvpn_prepare_other_group: "{{ 'remnawave_panel' if 'remnawave_nodes' in group_names else 'remnawave_nodes' }}"
    xvpn_prepare_other_host: "{{ groups[xvpn_prepare_other_group][0] }}"
    xvpn_prepare_other_names: "{{ 'panel.xvpn.test sub.xvpn.test' if 'remnawave_nodes' in group_names else 'node.xvpn.test' }}"
  tasks:
    - name: Map the names of the other VM to its address
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: "\\s{{ xvpn_prepare_other_names.split() | first | regex_escape }}(\\s|$)"
        line: "{{ hostvars[xvpn_prepare_other_host]['ansible_facts']['default_ipv4']['address'] }} {{ xvpn_prepare_other_names }}"
