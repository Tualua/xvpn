---
# Real playbooks/panel.yml and playbooks/node.yml on two enforcing VMs.
# include_vars persists for the host across the imported plays.
- name: Load the two-VM stand values
  hosts: all
  gather_facts: false
  tasks:
    - name: Load vars/node-vm.yml
      ansible.builtin.include_vars: vars/node-vm.yml

- name: Panel host
  ansible.builtin.import_playbook: ../../../playbooks/panel.yml
  vars:
    ansible_pipelining: true

- name: Node host
  ansible.builtin.import_playbook: ../../../playbooks/node.yml
  vars:
    ansible_pipelining: true

- name: Record the remnanode state after the first converge
  hosts: remnawave_nodes
  become: true
  gather_facts: true
  tasks:
    - name: Stat node.env
      ansible.builtin.stat:
        path: /var/lib/xvpn/rw-node/env/node.env
        checksum_algorithm: sha256
      register: xvpn_converge_node_env

    - name: Read the uid of the node service user
      ansible.builtin.getent:
        database: passwd
        key: rw-node

    - name: Read the InvocationID of remnanode
      ansible.builtin.command:
        argv:
          - systemctl
          - --user
          - show
          - -p
          - InvocationID
          - --value
          - remnanode.service
      become: true
      become_user: rw-node
      become_method: ansible.builtin.sudo
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd']['rw-node'][1] }}"
      register: xvpn_converge_node_invocation
      changed_when: false
      check_mode: false

    - name: Assert node.env exists and remnanode has an invocation
      ansible.builtin.assert:
        that:
          - xvpn_converge_node_env.stat.exists
          - xvpn_converge_node_env.stat.checksum | length > 0
          - xvpn_converge_node_invocation.stdout | trim | length > 0
        fail_msg: "node.env is missing or remnanode did not start after the first converge"
        quiet: true

    - name: Record the node.env checksum
      ansible.builtin.copy:
        content: "{{ xvpn_converge_node_env.stat.checksum }}\n"
        dest: /var/lib/xvpn-molecule/node_env_sha256
        owner: root
        group: root
        mode: "0600"
        force: false

    - name: Record the remnanode InvocationID
      ansible.builtin.copy:
        content: "{{ xvpn_converge_node_invocation.stdout | trim }}\n"
        dest: /var/lib/xvpn-molecule/remnanode_invocation
        owner: root
        group: root
        mode: "0600"
        force: false

- name: Record the key checksum of the node profile after the first converge
  hosts: remnawave_panel
  become: true
  gather_facts: false
  tasks:
    - name: Read the node profile
      ansible.builtin.include_tasks: ../shared/node_panel_read.yml
      vars:
        xvpn_np_name: node

    - name: Assert exactly one profile with keys exists
      ansible.builtin.assert:
        that:
          - xvpn_np_count | int == 1
        fail_msg: "the Panel holds {{ xvpn_np_count }} profiles named node after the first converge"
        quiet: true
      no_log: true

    # Only the sha256 of privateKey + shortIds is stored, never the keys.
    - name: Record the checksum of the Reality keys
      ansible.builtin.copy:
        content: "{{ xvpn_np_checksum }}\n"
        dest: /var/lib/xvpn-molecule/reality_checksum_after_first_converge
        owner: root
        group: root
        mode: "0600"
        force: false
      no_log: true
