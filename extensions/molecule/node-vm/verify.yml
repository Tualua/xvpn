---
- name: Node re-key
  hosts: remnawave_nodes
  become: true
  gather_facts: true
  vars:
    ansible_pipelining: true
  tasks:
    - name: Load vars/node-vm.yml
      ansible.builtin.include_vars: vars/node-vm.yml

    - name: Read the uid of the node service user
      ansible.builtin.getent:
        database: passwd
        key: rw-node

    - name: Re-key | read the recorded checksum and InvocationID
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /var/lib/xvpn-molecule/node_env_sha256
        - /var/lib/xvpn-molecule/remnanode_invocation
      register: xvpn_rekey_recorded

    # The explicit opt-in issues a new SECRET_KEY: node.env is rewritten and remnanode restarts.
    - name: Re-key | run the secret and service steps with the opt-in
      ansible.builtin.include_tasks: ../shared/node_rekey_run.yml
      vars:
        xvpn_rekey_flag: true

    - name: Re-key | stat node.env and read the InvocationID
      ansible.builtin.include_tasks: ../shared/node_state.yml

    - name: Re-key | assert a new key and a restarted remnanode
      ansible.builtin.assert:
        that:
          - xvpn_node_state_sha != (xvpn_rekey_recorded.results[0].content | b64decode | trim)
          - xvpn_node_state_invocation != (xvpn_rekey_recorded.results[1].content | b64decode | trim)
          - xvpn_node_state_active == 'active'
        fail_msg: "the opt-in re-key did not produce a new node.env and a restarted remnanode"
        quiet: true

    - name: Re-key | keep the values of the re-keyed state
      ansible.builtin.set_fact:
        xvpn_rekey_sha: "{{ xvpn_node_state_sha }}"
        xvpn_rekey_invocation: "{{ xvpn_node_state_invocation }}"

    - name: Re-key | record the new checksum and InvocationID
      ansible.builtin.copy:
        content: "{{ item.value }}\n"
        dest: "{{ item.key }}"
        owner: root
        group: root
        mode: "0600"
        force: true
      loop:
        - { key: /var/lib/xvpn-molecule/node_env_sha256, value: "{{ xvpn_node_state_sha }}" }
        - { key: /var/lib/xvpn-molecule/remnanode_invocation, value: "{{ xvpn_node_state_invocation }}" }
      loop_control:
        label: "{{ item.key }}"

    # Without the flag and with node.env present: no keygen, no write, no restart.
    - name: Re-key | run the steps again without the flag
      ansible.builtin.include_tasks: ../shared/node_rekey_run.yml
      vars:
        xvpn_rekey_flag: false

    - name: Re-key | stat node.env and read the InvocationID after the plain run
      ansible.builtin.include_tasks: ../shared/node_state.yml

    - name: Re-key | assert the plain run changed nothing
      ansible.builtin.assert:
        that:
          - xvpn_node_state_sha == xvpn_rekey_sha
          - xvpn_node_state_invocation == xvpn_rekey_invocation
        fail_msg: "a run without xvpn_node_rekey changed node.env or restarted remnanode"
        quiet: true

- name: Verify the node host
  hosts: remnawave_nodes
  become: true
  gather_facts: true
  vars:
    ansible_pipelining: true
  tasks:
    - name: Verify the node edge on loopback
      ansible.builtin.include_tasks: ../shared/verify_node.yml
      vars:
        xvpn_verify_node_user: rw-edge
        xvpn_verify_node_domain: node.xvpn.test

- name: Gate failure case on the node host
  hosts: remnawave_nodes
  become: true
  gather_facts: true
  vars:
    ansible_pipelining: true
  tasks:
    - name: Load vars/node-vm.yml
      ansible.builtin.include_vars: vars/node-vm.yml

    - name: Gate | record the open ports before
      ansible.builtin.command:
        argv: [firewall-cmd, --list-ports]
      register: xvpn_gate_ports_before
      changed_when: false

    # xvpn_negative_case: gate-no-certificate
    - name: Gate | run the certificate gate for a domain without a certificate
      block:
        - name: Gate | include the gate tasks for absent.xvpn.test
          ansible.builtin.include_role:
            name: xvpn.remnawave.node
            tasks_from: gate
          vars:
            xvpn_node_domain: absent.xvpn.test
            xvpn_edge_https_address: "127.0.0.1:8443"
            xvpn_node_cert_gate_retries: 2
            xvpn_node_cert_gate_delay: 1

        - name: Gate | record that the gate passed (must not happen)
          ansible.builtin.set_fact:
            xvpn_gate_failure_msg: ""
      rescue:
        - name: Gate | keep the failure message
          ansible.builtin.set_fact:
            xvpn_gate_failure_msg: "{{ ansible_failed_result.msg | default('') }}"

    - name: Gate | record the open ports after
      ansible.builtin.command:
        argv: [firewall-cmd, --list-ports]
      register: xvpn_gate_ports_after
      changed_when: false

    - name: Gate | assert the message and the unchanged firewall
      ansible.builtin.assert:
        that:
          - "'certificate for absent.xvpn.test' in xvpn_gate_failure_msg"
          - "'STEAL-05' in xvpn_gate_failure_msg"
          - xvpn_gate_ports_before.stdout.split() | sort == xvpn_gate_ports_after.stdout.split() | sort
        fail_msg: >-
          gate-no-certificate: message '{{ xvpn_gate_failure_msg }}',
          ports before '{{ xvpn_gate_ports_before.stdout }}' after '{{ xvpn_gate_ports_after.stdout }}'
        quiet: true

- name: Verify the runtime and zero AVC on both VMs
  hosts: all
  become: true
  gather_facts: true
  vars:
    ansible_pipelining: true
  tasks:
    - name: Verify the edge runtime and the audit log since the marker
      ansible.builtin.include_tasks: ../shared/verify_runtime.yml
      vars:
        xvpn_verify_unit: traefik.service
        xvpn_verify_port: 80
        xvpn_verify_http_status: 404

- name: Verify the node from the Panel VM
  hosts: remnawave_panel
  become: true
  gather_facts: false
  vars:
    xvpn_verify_node_ip: "{{ hostvars[groups['remnawave_nodes'][0]]['ansible_facts']['default_ipv4']['address'] }}"
  tasks:
    - name: Probe the plain HTTP answer of the node domain
      ansible.builtin.command:
        argv:
          - curl
          - -sS
          - -o
          - /dev/null
          - --max-time
          - "10"
          - -w
          - "%{http_code} %{redirect_url}"
          - http://node.xvpn.test/
      register: xvpn_verify_node_redirect
      changed_when: false

    - name: Assert :80 answers only the redirect to HTTPS
      ansible.builtin.assert:
        that:
          - xvpn_verify_node_redirect.stdout.split()[0] in ['301', '308']
          - xvpn_verify_node_redirect.stdout.split()[1] is match('https://node\.xvpn\.test/')
        fail_msg: "node.xvpn.test:80 did not answer the HTTPS redirect: {{ xvpn_verify_node_redirect.stdout }}"
        quiet: true

    # xvpn_negative_case: loopback-entrypoint-from-panel
    # The TLS entrypoint is loopback-only (D-13): a connect to <node>:8443 from another host must time out or be refused.
    - name: Try to reach the loopback entrypoint of the node from the Panel VM
      block:
        - name: Connect to the node on 8443
          ansible.builtin.wait_for:
            host: "{{ xvpn_verify_node_ip }}"
            port: 8443
            timeout: 5

        - name: Record that the loopback entrypoint answered (must not happen)
          ansible.builtin.set_fact:
            xvpn_verify_node_8443_reachable: true
      rescue:
        - name: Record that the loopback entrypoint is unreachable from outside
          ansible.builtin.set_fact:
            xvpn_verify_node_8443_reachable: false

    - name: Assert the loopback entrypoint is unreachable from the Panel VM
      ansible.builtin.assert:
        that:
          - not (xvpn_verify_node_8443_reachable | bool)
        fail_msg: "{{ xvpn_verify_node_ip }}:8443 answered from the Panel VM; the TLS entrypoint is not loopback-only"
        quiet: true

- name: Verify the node registration in the Panel
  hosts: remnawave_panel
  become: true
  gather_facts: false
  tasks:
    - name: Verify the node profile, its keys and the recorded checksum
      ansible.builtin.include_tasks: ../shared/verify_node_panel.yml
