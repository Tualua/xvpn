---
driver:
  name: podman
platforms:
  - name: rocky10
    image: docker.io/rockylinux/rockylinux:10-ubi-init
    pre_build_image: true
    command: /usr/sbin/init
    systemd: always
    privileged: true
  - name: alma10
    image: docker.io/almalinux/10-init:10
    pre_build_image: true
    command: /usr/sbin/init
    systemd: always
    privileged: true
ansible:
  executor:
    backend: ansible-playbook
scenario:
  # verify is added by Plan 04 together with verify.yml
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - destroy
