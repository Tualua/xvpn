---
- name: Verify the rootless fundament and the guards (container tier)
  hosts: all
  become: true
  vars:
    ansible_pipelining: true
  tasks:
    - name: Verify the rootless plumbing and the bind probes
      ansible.builtin.include_tasks: ../shared/verify_rootless.yml
      vars:
        # The container tier activates no unit, so :80 is free and probed directly.
        xvpn_verify_bind_probe_ports: [80, 443]
        xvpn_verify_quadlet_unit: traefik.container

    - name: Verify the host baseline (SELinux, firewalld ports, SSH)
      ansible.builtin.include_tasks: ../shared/verify_common.yml
      vars:
        xvpn_verify_firewall_cmd: firewall-offline-cmd
        xvpn_verify_expected_ports: ["80/tcp", "443/tcp"]

    # xvpn_negative_case: broken-unit
    - name: Negative case broken-unit
      block:
        - name: Deploy a unit that the Quadlet generator rejects
          ansible.builtin.include_role:
            name: xvpn.remnawave.podman_rootless
            tasks_from: quadlet
          vars:
            xvpn_podman_rootless_quadlet_user: rw-edge
            xvpn_podman_rootless_quadlet_activate: false
            xvpn_podman_rootless_quadlet_specs:
              - template_src: "{{ (playbook_dir ~ '/../shared/templates/xvpn-broken.container.j2') | realpath }}"
        - name: Fail when the broken unit was accepted
          ansible.builtin.fail:
            msg: "negative case broken-unit was accepted"
      rescue:
        - name: Record that the broken unit was rejected by the dry-run
          ansible.builtin.set_fact:
            xvpn_negative_rejected: "{{ (xvpn_negative_rejected | default([])) + ['broken-unit'] }}"
          when:
            - not (ansible_failed_result.msg | string).startswith('negative case')
            - (ansible_failed_result.msg | string).startswith('Quadlet dry-run')
            - "'xvpn-broken' in (ansible_failed_result.msg | string)"

    - name: Stat the broken unit in the user Quadlet directory
      ansible.builtin.stat:
        path: /var/lib/xvpn/rw-edge/.config/containers/systemd/xvpn-broken.container
      register: xvpn_verify_broken_unit

    - name: Assert the broken unit was not installed
      ansible.builtin.assert:
        that:
          - not xvpn_verify_broken_unit.stat.exists
        fail_msg: "xvpn-broken.container was installed although the generator rejects it"
        quiet: true

    # xvpn_negative_case: bad-user-name
    - name: Negative case bad-user-name
      block:
        - name: Run the role with an injected service user name
          ansible.builtin.include_role:
            name: xvpn.remnawave.podman_rootless
          vars:
            xvpn_podman_rootless_users:
              - name: "x;id"
            xvpn_podman_rootless_manage_user_manager: false
        - name: Fail when the injected user name was accepted
          ansible.builtin.fail:
            msg: "negative case bad-user-name was accepted"
      rescue:
        - name: Record that the injected user name was rejected
          ansible.builtin.set_fact:
            xvpn_negative_rejected: "{{ (xvpn_negative_rejected | default([])) + ['bad-user-name'] }}"
          when:
            - not (ansible_failed_result.msg | string).startswith('negative case')
            # the assert runs in a loop, so the text sits in the per-item results
            - "'Invalid service user name' in (ansible_failed_result | to_json)"

    - name: Look up the injected user name
      ansible.builtin.command:
        argv:
          - getent
          - passwd
          - "x;id"
      register: xvpn_verify_injected_user
      changed_when: false
      failed_when: false

    - name: Assert the injected user was not created
      ansible.builtin.assert:
        that:
          - xvpn_verify_injected_user.rc == 2
        fail_msg: "a user named 'x;id' exists: rc={{ xvpn_verify_injected_user.rc }}"
        quiet: true

    # xvpn_negative_case: relative-template
    - name: Negative case relative-template
      block:
        - name: Deploy a spec with a relative template path
          ansible.builtin.include_role:
            name: xvpn.remnawave.podman_rootless
            tasks_from: quadlet
          vars:
            xvpn_podman_rootless_quadlet_user: rw-edge
            xvpn_podman_rootless_quadlet_activate: false
            xvpn_podman_rootless_quadlet_specs:
              - template_src: "templates/xvpn-fixture.container.j2"
        - name: Fail when the relative template path was accepted
          ansible.builtin.fail:
            msg: "negative case relative-template was accepted"
      rescue:
        - name: Record that the relative template path was rejected
          ansible.builtin.set_fact:
            xvpn_negative_rejected: "{{ (xvpn_negative_rejected | default([])) + ['relative-template'] }}"
          when:
            - not (ansible_failed_result.msg | string).startswith('negative case')
            # the assert runs in a loop, so the text sits in the per-item results
            - "'template_src must be an absolute path' in (ansible_failed_result | to_json)"

    # xvpn_negative_case: no-ssh-zone
    - name: Create a zone without ssh
      ansible.builtin.command:
        argv:
          - firewall-offline-cmd
          - --new-zone=xvpn-nossh
      register: xvpn_verify_nossh_zone
      changed_when: xvpn_verify_nossh_zone.rc == 0
      failed_when: xvpn_verify_nossh_zone.rc != 0 and 'NAME_CONFLICT' not in xvpn_verify_nossh_zone.stderr

    - name: Bind a dummy interface to the zone without ssh
      ansible.builtin.command:
        argv:
          - firewall-offline-cmd
          - --zone=xvpn-nossh
          - --add-interface=xvpndummy0
      register: xvpn_verify_nossh_bind
      changed_when: xvpn_verify_nossh_bind.rc == 0
      failed_when: xvpn_verify_nossh_bind.rc != 0 and 'ZONE_ALREADY_SET' not in xvpn_verify_nossh_bind.stderr

    - name: Resolve the zone of the dummy interface
      ansible.builtin.command:
        argv:
          - firewall-offline-cmd
          - --get-zone-of-interface=xvpndummy0
      register: xvpn_verify_nossh_resolved
      changed_when: false
      failed_when: false

    - name: Assert the dummy interface resolves to the zone without ssh
      ansible.builtin.assert:
        that:
          - xvpn_verify_nossh_resolved.rc == 0
          - xvpn_verify_nossh_resolved.stdout | trim == 'xvpn-nossh'
        fail_msg: >-
          firewall-offline-cmd --get-zone-of-interface did not resolve xvpn-nossh (flagged assumption);
          roles/common would fall back to the default zone
        quiet: true

    - name: Negative case no-ssh-zone
      block:
        - name: Run common against the zone without ssh
          ansible.builtin.include_role:
            name: xvpn.remnawave.common
          vars:
            xvpn_common_firewalld_offline: true
            xvpn_public_interface: xvpndummy0
            xvpn_common_firewall_ports: ["8088/tcp"]
        - name: Fail when the missing ssh was accepted
          ansible.builtin.fail:
            msg: "negative case no-ssh-zone was accepted"
      rescue:
        - name: Record that the zone without ssh was rejected
          ansible.builtin.set_fact:
            xvpn_negative_rejected: "{{ (xvpn_negative_rejected | default([])) + ['no-ssh-zone'] }}"
          when:
            - not (ansible_failed_result.msg | string).startswith('negative case')
            - "'is not allowed in firewalld zone xvpn-nossh' in (ansible_failed_result | to_json)"

    - name: List the ports of the zone without ssh
      ansible.builtin.command:
        argv:
          - firewall-offline-cmd
          - --zone=xvpn-nossh
          - --list-ports
      register: xvpn_verify_nossh_ports
      changed_when: false

    - name: Assert no port was added to the zone without ssh
      ansible.builtin.assert:
        that:
          - "'8088' not in xvpn_verify_nossh_ports.stdout"
        fail_msg: "8088/tcp was added to xvpn-nossh although ssh is not allowed there"
        quiet: true

    # xvpn_negative_case: port-without-protocol
    - name: Negative case port-without-protocol
      block:
        - name: Run common with a port entry without protocol
          ansible.builtin.include_role:
            name: xvpn.remnawave.common
          vars:
            xvpn_common_firewalld_offline: true
            xvpn_common_firewall_ports: ["80"]
        - name: Fail when the port entry was accepted
          ansible.builtin.fail:
            msg: "negative case port-without-protocol was accepted"
      rescue:
        - name: Record that the port entry was rejected
          ansible.builtin.set_fact:
            xvpn_negative_rejected: "{{ (xvpn_negative_rejected | default([])) + ['port-without-protocol'] }}"
          when:
            - not (ansible_failed_result.msg | string).startswith('negative case')
            # the assert runs in a loop, so the text sits in the per-item results
            - "'Invalid firewall port entry' in (ansible_failed_result | to_json)"

    # xvpn_negative_case: selinux-permissive
    - name: Write the fake Permissive mode
      ansible.builtin.copy:
        content: "Permissive\n"
        dest: /etc/xvpn-test-selinux-mode
        mode: "0644"

    - name: Negative case selinux-permissive
      block:
        - name: Run common while getenforce reports Permissive
          ansible.builtin.include_role:
            name: xvpn.remnawave.common
          vars:
            xvpn_common_firewalld_offline: true
            xvpn_common_firewall_ports: ["8089/tcp"]
        - name: Fail when Permissive was accepted
          ansible.builtin.fail:
            msg: "negative case selinux-permissive was accepted"
      rescue:
        - name: Record that Permissive was rejected
          ansible.builtin.set_fact:
            xvpn_negative_rejected: "{{ (xvpn_negative_rejected | default([])) + ['selinux-permissive'] }}"
          when:
            - not (ansible_failed_result.msg | string).startswith('negative case')
            - "'SELinux must be Enforcing' in (ansible_failed_result.msg | string)"
      always:
        - name: Restore the fake Enforcing mode
          ansible.builtin.copy:
            content: "Enforcing\n"
            dest: /etc/xvpn-test-selinux-mode
            mode: "0644"

    - name: List the ports of the default zone
      ansible.builtin.command:
        argv:
          - firewall-offline-cmd
          - --list-ports
      register: xvpn_verify_default_ports
      changed_when: false

    - name: Assert no port was added while SELinux was Permissive
      ansible.builtin.assert:
        that:
          - "'8089' not in xvpn_verify_default_ports.stdout"
        fail_msg: "8089/tcp was added although SELinux reported Permissive"
        quiet: true

    - name: Read the rendered Traefik static configuration
      ansible.builtin.slurp:
        src: /var/lib/xvpn/rw-edge/traefik/static/traefik.yml
      register: xvpn_verify_edge_static

    - name: Assert the static configuration targets the staging CA and logs no path (QA-05, D-19)
      ansible.builtin.assert:
        that:
          - "'acme-staging-v02' in xvpn_verify_edge_text"
          - "'https://acme-v02.api.letsencrypt.org/directory' not in xvpn_verify_edge_text"
          - xvpn_verify_edge_parsed.accessLog.fields.names.RequestPath == 'drop'
          - xvpn_verify_edge_parsed.accessLog.fields.headers.defaultMode == 'drop'
          - "xvpn_verify_edge_parsed.accessLog.fields.headers.names == {'User-Agent': 'keep'}"
        fail_msg: "rendered traefik.yml does not meet QA-05 / D-19"
        quiet: true
      vars:
        xvpn_verify_edge_text: "{{ xvpn_verify_edge_static.content | b64decode }}"
        xvpn_verify_edge_parsed: "{{ xvpn_verify_edge_text | from_yaml }}"

    - name: Stat the edge units and the shared route file
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /var/lib/xvpn/rw-edge/.config/containers/systemd/traefik.container
        - /var/lib/xvpn/rw-edge/.config/containers/systemd/xvpn-decoy.container
        - /var/lib/xvpn/rw-edge/traefik/dynamic/00-edge.yml
        - /var/lib/xvpn/rw-edge/decoy/site/index.html
      register: xvpn_verify_edge_files

    - name: Assert the edge files exist with the expected owner and mode
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.pw_name == 'rw-edge'
          - not (item.item is search('00-edge[.]yml$')) or item.stat.mode == '0600'
          - not (item.item is search('index[.]html$')) or item.stat.mode == '0644'
        fail_msg: "unexpected edge file state: {{ item.item }}"
        quiet: true
      loop: "{{ xvpn_verify_edge_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Stat the Panel route file
      ansible.builtin.stat:
        path: /var/lib/xvpn/rw-edge/traefik/dynamic/panel.yml
      register: xvpn_verify_panel_route

    - name: Read the Panel route file
      ansible.builtin.slurp:
        src: /var/lib/xvpn/rw-edge/traefik/dynamic/panel.yml
      register: xvpn_verify_panel_routes

    - name: Assert the Panel route file holds the decoy router
      ansible.builtin.assert:
        that:
          - xvpn_verify_panel_route.stat.exists
          - xvpn_verify_panel_route.stat.pw_name == 'rw-edge'
          - xvpn_verify_panel_route.stat.mode == '0600'
          - "'xvpn-panel-decoy' in (xvpn_verify_panel_routes.content | b64decode)"
        fail_msg: "panel.yml is missing, not 0600 rw-edge, or lacks xvpn-panel-decoy"
        quiet: true

    # xvpn_negative_case: edge-custom-ca-without-server
    - name: Negative case edge-custom-ca-without-server
      block:
        - name: Run the edge role with a custom CA and no server
          ansible.builtin.include_role:
            name: xvpn.remnawave.edge
          vars:
            xvpn_edge_activate: false
            xvpn_edge_acme_ca: custom
            xvpn_edge_acme_ca_server: ""
        - name: Fail when the custom CA without a server was accepted
          ansible.builtin.fail:
            msg: "negative case edge-custom-ca-without-server was accepted"
      rescue:
        - name: Record that the custom CA without a server was rejected
          ansible.builtin.set_fact:
            xvpn_negative_rejected: "{{ (xvpn_negative_rejected | default([])) + ['edge-custom-ca-without-server'] }}"
          when:
            - not (ansible_failed_result.msg | string).startswith('negative case')
            - "'xvpn_edge_acme_ca_server' in (ansible_failed_result | to_json)"

    # xvpn_negative_case: edge-bad-route-name
    - name: Negative case edge-bad-route-name
      block:
        - name: Write a route file with an injected name
          ansible.builtin.include_role:
            name: xvpn.remnawave.edge
            tasks_from: route
          vars:
            xvpn_edge_route_name: "x;y"
            xvpn_edge_route_src: "{{ (playbook_dir ~ '/../../../roles/edge/templates/00-edge.yml.j2') | realpath }}"
        - name: Fail when the injected route name was accepted
          ansible.builtin.fail:
            msg: "negative case edge-bad-route-name was accepted"
      rescue:
        - name: Record that the injected route name was rejected
          ansible.builtin.set_fact:
            xvpn_negative_rejected: "{{ (xvpn_negative_rejected | default([])) + ['edge-bad-route-name'] }}"
          when:
            - not (ansible_failed_result.msg | string).startswith('negative case')
            - "'Invalid route name' in (ansible_failed_result | to_json)"

    - name: Stat the route file of the injected name
      ansible.builtin.stat:
        path: "/var/lib/xvpn/rw-edge/traefik/dynamic/x;y.yml"
      register: xvpn_verify_edge_bad_route

    - name: Assert no route file was written for the injected name
      ansible.builtin.assert:
        that:
          - not xvpn_verify_edge_bad_route.stat.exists
        fail_msg: "x;y.yml was written although the route name is invalid"
        quiet: true

    # xvpn_negative_case: panel-placeholder-domain
    - name: Negative case panel-placeholder-domain
      block:
        - name: Run the panel role with a placeholder domain
          ansible.builtin.include_role:
            name: xvpn.remnawave.panel
          vars:
            xvpn_panel_domain: panel.example.com
        - name: Fail when the placeholder domain was accepted
          ansible.builtin.fail:
            msg: "negative case panel-placeholder-domain was accepted"
      rescue:
        - name: Record that the placeholder domain was rejected
          ansible.builtin.set_fact:
            xvpn_negative_rejected: "{{ (xvpn_negative_rejected | default([])) + ['panel-placeholder-domain'] }}"
          when:
            - not (ansible_failed_result.msg | string).startswith('negative case')
            - "'xvpn_panel_domain' in (ansible_failed_result | to_json)"

    - name: Assert every negative case was rejected for the expected reason
      ansible.builtin.assert:
        that:
          - >-
            (xvpn_negative_rejected | default([])) | sort ==
            ['bad-user-name', 'broken-unit', 'edge-bad-route-name', 'edge-custom-ca-without-server', 'no-ssh-zone',
             'panel-placeholder-domain', 'port-without-protocol', 'relative-template', 'selinux-permissive']
        fail_msg: "negative cases rejected for the expected reason: {{ xvpn_negative_rejected | default([]) }}"
        quiet: true
