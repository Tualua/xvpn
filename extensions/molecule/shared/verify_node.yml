---
# Node host assertions of the VM tier: the loopback TLS entrypoint holds a certificate of the node domain that
# verifies against the Pebble issuer root stored by node-vm/prepare.yml.
# Inputs: xvpn_verify_node_user (service user of the edge), xvpn_verify_node_domain (required).
- name: Verify node | present the certificate on the loopback entrypoint
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: >-
      openssl s_client -connect 127.0.0.1:8443 -servername {{ xvpn_verify_node_domain }}
      -verify_hostname {{ xvpn_verify_node_domain }} -verify_return_error
      -CAfile /var/lib/xvpn-molecule/pebble-issuer-root.pem </dev/null 2>&1
  register: xvpn_verify_node_tls
  until: >-
    xvpn_verify_node_tls.rc == 0 and xvpn_verify_node_tls.stdout is search('Verification: OK')
  retries: 30
  delay: 5
  changed_when: false

- name: Verify node | assert the certificate verified for the node domain
  ansible.builtin.assert:
    that:
      - "xvpn_verify_node_tls.stdout is search('Verification: OK')"
    fail_msg: "no verified certificate for {{ xvpn_verify_node_domain }} on 127.0.0.1:8443: {{ xvpn_verify_node_tls.stdout }}"
    quiet: true

- name: Verify node | list the listeners on 8443
  ansible.builtin.command:
    argv:
      - ss
      - -H
      - -ltn
      - sport = :8443
  register: xvpn_verify_node_ss
  changed_when: false

- name: Verify node | assert 8443 is bound to 127.0.0.1 only
  ansible.builtin.assert:
    that:
      - xvpn_verify_node_ss.stdout_lines | length > 0
      - xvpn_verify_node_ss.stdout_lines | map('split') | map(attribute=3) | unique | list == ['127.0.0.1:8443']
    fail_msg: "8443 is not bound to loopback only: {{ xvpn_verify_node_ss.stdout }}"
    quiet: true

# remnanode (NODE-01): rootless, host network, no capability, container_t. The AVC check runs after this file.
- name: Verify node | read the uid of the node service user
  ansible.builtin.getent:
    database: passwd
    key: rw-node

- name: Verify node | wait until remnanode is active
  ansible.builtin.command:
    argv:
      - systemctl
      - --user
      - is-active
      - remnanode.service
  become: true
  become_user: rw-node
  become_method: ansible.builtin.sudo
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd']['rw-node'][1] }}"
  register: xvpn_verify_node_active
  until: xvpn_verify_node_active.stdout | trim == 'active'
  retries: 30
  delay: 5
  changed_when: false

- name: Verify node | list the listener on 2222
  ansible.builtin.command:
    argv:
      - ss
      - -H
      - -ltnpe
      - sport = :2222
  register: xvpn_verify_node_api_ss
  until: xvpn_verify_node_api_ss.stdout_lines | length > 0
  retries: 30
  delay: 5
  changed_when: false

- name: Verify node | assert the listener belongs to rw-node
  ansible.builtin.assert:
    that:
      - xvpn_verify_node_api_ss.stdout is search('uid:' ~ ansible_facts['getent_passwd']['rw-node'][1] ~ '(\s|$)')
    fail_msg: "the :2222 listener is not owned by rw-node: {{ xvpn_verify_node_api_ss.stdout }}"
    quiet: true

- name: Verify node | inspect the remnanode container
  ansible.builtin.command:
    argv:
      - podman
      - inspect
      - --format
      - "{{ '{{.HostConfig.NetworkMode}}|{{len .HostConfig.CapAdd}}|{{.ProcessLabel}}' }}"
      - remnanode
  become: true
  become_user: rw-node
  become_method: ansible.builtin.sudo
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd']['rw-node'][1] }}"
  register: xvpn_verify_node_inspect
  changed_when: false

- name: Verify node | assert host network, no added capability, container_t
  ansible.builtin.assert:
    that:
      - xvpn_verify_node_inspect.stdout | trim | split('|') | first == 'host'
      - (xvpn_verify_node_inspect.stdout | trim).split('|')[1] == '0'
      - (xvpn_verify_node_inspect.stdout | trim).split('|')[2] is search('container_t')
    fail_msg: "remnanode is not host-networked, capability-free and container_t: {{ xvpn_verify_node_inspect.stdout }}"
    quiet: true

- name: Verify node | stat node.env and runtime.env
  ansible.builtin.stat:
    path: "{{ item }}"
    checksum_algorithm: sha256
  loop:
    - /var/lib/xvpn/rw-node/env/node.env
    - /var/lib/xvpn/rw-node/env/runtime.env
  register: xvpn_verify_node_envs

- name: Verify node | read the recorded node.env checksum and runtime.env
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - /var/lib/xvpn-molecule/node_env_sha256
    - /var/lib/xvpn/rw-node/env/runtime.env
  register: xvpn_verify_node_env_read

- name: Verify node | assert the env files
  ansible.builtin.assert:
    that:
      - xvpn_verify_node_envs.results[0].stat.mode == '0600'
      - xvpn_verify_node_envs.results[0].stat.pw_name == 'rw-node'
      - xvpn_verify_node_envs.results[0].stat.checksum == (xvpn_verify_node_env_read.results[0].content | b64decode | trim)
      - xvpn_verify_node_envs.results[1].stat.mode == '0600'
      - (xvpn_verify_node_env_read.results[1].content | b64decode) is search('(?m)^NODE_PORT=2222$')
    fail_msg: "node.env changed since the first converge or the env files have the wrong mode/owner"
    quiet: true

# NODE-02 / STEAL-05: 443 only after the gate, 2222 only for the Panel.
- name: Verify node | gather the network facts of the Panel VM
  ansible.builtin.setup:
    gather_subset: [network]
  delegate_to: "{{ groups['remnawave_panel'][0] }}"
  delegate_facts: true

- name: Verify node | set the Panel address
  ansible.builtin.set_fact:
    xvpn_verify_panel_ip: "{{ hostvars[groups['remnawave_panel'][0]]['ansible_facts']['default_ipv4']['address'] }}"

- name: Verify node | the firewall holds 443/tcp and exactly one rich rule for the Panel
  ansible.builtin.include_tasks: verify_common.yml
  vars:
    xvpn_verify_expected_ports: ["80/tcp", "443/tcp"]
    xvpn_verify_expected_rich_rules:
      - 'rule family="ipv4" source address="{{ xvpn_verify_panel_ip }}" port port="2222" protocol="tcp" accept'

- name: Verify node | the node API port answers the Panel VM
  ansible.builtin.wait_for:
    host: "{{ ansible_facts['default_ipv4']['address'] }}"
    port: 2222
    timeout: 20
  delegate_to: "{{ groups['remnawave_panel'][0] }}"

# xvpn_negative_case: api-port-from-controller
- name: Verify node | the node API port does not answer the controller
  block:
    - name: Connect to the node API port from the controller
      ansible.builtin.wait_for:
        host: "{{ ansible_facts['default_ipv4']['address'] }}"
        port: 2222
        timeout: 5
      delegate_to: localhost
      become: false

    - name: Record that the controller reached the node API port (must not happen)
      ansible.builtin.set_fact:
        xvpn_verify_api_from_controller: true
  rescue:
    - name: Record that the node API port is unreachable from the controller
      ansible.builtin.set_fact:
        xvpn_verify_api_from_controller: false

- name: Verify node | assert the controller cannot reach the node API port
  ansible.builtin.assert:
    that:
      - not (xvpn_verify_api_from_controller | bool)
    fail_msg: "{{ ansible_facts['default_ipv4']['address'] }}:2222 answered from the controller"
    quiet: true
