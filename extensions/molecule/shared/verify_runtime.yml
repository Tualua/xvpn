---
# Runtime, SELinux label, dontaudit-state and AVC assertions for the VM tier (real enforcing host).
# Inputs: xvpn_verify_user (default rw-edge), xvpn_verify_unit (default traefik.service),
#         xvpn_verify_port (default 80), xvpn_verify_http_status (default 200; status of a bare-IP request).
# The AVC marker comes from extensions/molecule/vm/prepare.yml (/var/lib/xvpn-molecule/avc_marker).
- name: Resolve the runtime verify inputs
  ansible.builtin.set_fact:
    xvpn_verify_rt_user: "{{ xvpn_verify_user | default('rw-edge') }}"
    xvpn_verify_rt_unit: "{{ xvpn_verify_unit | default('traefik.service') }}"
    xvpn_verify_rt_port: "{{ xvpn_verify_port | default(80) }}"
    xvpn_verify_rt_status: "{{ xvpn_verify_http_status | default(200) | int }}"

- name: Read the service user account
  ansible.builtin.getent:
    database: passwd
    key: "{{ xvpn_verify_rt_user }}"

- name: Set the uid and the user manager runtime directory
  ansible.builtin.set_fact:
    xvpn_verify_rt_uid: "{{ ansible_facts['getent_passwd'][xvpn_verify_rt_user][1] }}"
    xvpn_verify_rt_home: "/var/lib/xvpn/{{ xvpn_verify_rt_user }}"

- name: Wait until the unit is active in the user manager of the service user
  ansible.builtin.command:
    argv:
      - systemctl
      - --user
      - is-active
      - "{{ xvpn_verify_rt_unit }}"
  become: true
  become_user: "{{ xvpn_verify_rt_user }}"
  become_method: ansible.builtin.sudo
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ xvpn_verify_rt_uid }}"
  register: xvpn_verify_rt_active
  until: xvpn_verify_rt_active.stdout | trim == 'active'
  retries: 60
  delay: 10
  changed_when: false

- name: Answer on the port from the controller
  ansible.builtin.uri:
    url: "http://{{ ansible_host | default(inventory_hostname) }}:{{ xvpn_verify_rt_port }}/"
    status_code: "{{ xvpn_verify_rt_status | int }}"
  delegate_to: localhost
  become: false
  register: xvpn_verify_rt_http
  until: xvpn_verify_rt_http.status == (xvpn_verify_rt_status | int)
  retries: 12
  delay: 5

- name: List the listener on the port
  ansible.builtin.command:
    argv:
      - ss
      - -H
      - -ltnpe
      - "sport = :{{ xvpn_verify_rt_port }}"
  register: xvpn_verify_rt_ss
  changed_when: false

- name: Assert the listener is owned by the service user
  ansible.builtin.assert:
    that:
      - xvpn_verify_rt_ss.stdout is search('uid:' ~ xvpn_verify_rt_uid ~ '(\s|$)')
    fail_msg: "the :{{ xvpn_verify_rt_port }} listener is not owned by uid {{ xvpn_verify_rt_uid }}: {{ xvpn_verify_rt_ss.stdout }}"
    quiet: true

- name: Read the SELinux mode
  ansible.builtin.command: /usr/sbin/getenforce
  register: xvpn_verify_rt_getenforce
  changed_when: false

- name: Assert SELinux is Enforcing
  ansible.builtin.assert:
    that:
      - xvpn_verify_rt_getenforce.stdout | trim == 'Enforcing'
    fail_msg: "getenforce reports {{ xvpn_verify_rt_getenforce.stdout }}"
    quiet: true

- name: Read the SELinux context of the service user home
  ansible.builtin.command:
    argv:
      - ls
      - -Zd
      - "{{ xvpn_verify_rt_home }}"
  register: xvpn_verify_rt_home_ctx
  changed_when: false

- name: Read the SELinux context of the container storage
  ansible.builtin.command:
    argv:
      - ls
      - -Zd
      - "{{ xvpn_verify_rt_home }}/.local/share/containers/storage"
  register: xvpn_verify_rt_storage_ctx
  changed_when: false

- name: Assert the home and storage labels
  ansible.builtin.assert:
    that:
      - xvpn_verify_rt_home_ctx.stdout is search('user_home_dir_t')
      - xvpn_verify_rt_storage_ctx.stdout is not search('var_lib_t')
      - xvpn_verify_rt_storage_ctx.stdout is not search('default_t')
    fail_msg: "home {{ xvpn_verify_rt_home_ctx.stdout }}; storage {{ xvpn_verify_rt_storage_ctx.stdout }}"
    quiet: true

# D-08 container paths: the expected type is the type the policy assigns to the same relative path
# under /home/<user>. It is not hardcoded (RESEARCH Pitfall 5 marks the /home-equivalent values as assumed).
# The four D-08 container paths relative to the service user home.
- name: Verify the D-08 container path labels
  vars:
    xvpn_verify_label_paths:
      - .config/containers
      - .config/containers/systemd
      - .local/share/containers
      - .local/share/containers/storage
  block:
    - name: Pick the policy lookup tool
      ansible.builtin.command:
        argv:
          - sh
          - -c
          - 'if command -v matchpathcon >/dev/null 2>&1; then echo matchpathcon; elif command -v selabel_lookup >/dev/null 2>&1; then echo selabel_lookup; fi'
      register: xvpn_verify_rt_lookup_tool
      changed_when: false

    - name: Assert a policy lookup tool is available
      ansible.builtin.assert:
        that:
          - xvpn_verify_rt_lookup_tool.stdout | trim | length > 0
        fail_msg: "neither matchpathcon nor selabel_lookup is installed (libselinux-utils); the D-08 label comparison cannot run"
        quiet: true

    - name: Read the on-disk context of each D-08 container path
      ansible.builtin.command:
        argv:
          - stat
          - -c
          - "%C"
          - "{{ xvpn_verify_rt_home }}/{{ xvpn_label_rel }}"
      register: xvpn_verify_rt_actual
      changed_when: false
      loop: "{{ xvpn_verify_label_paths }}"
      loop_control:
        loop_var: xvpn_label_rel
        label: "{{ xvpn_label_rel }}"

    # matchpathcon -n prints the policy context of the /home twin; selabel_lookup -b file -k is the same lookup.
    - name: Read the policy context of the /home twin of each D-08 container path
      ansible.builtin.command:
        argv: >-
          {{ ['matchpathcon', '-n', '/home/' ~ xvpn_verify_rt_user ~ '/' ~ xvpn_label_rel]
             if xvpn_verify_rt_lookup_tool.stdout | trim == 'matchpathcon'
             else ['selabel_lookup', '-b', 'file', '-k', '/home/' ~ xvpn_verify_rt_user ~ '/' ~ xvpn_label_rel] }}
      register: xvpn_verify_rt_twin
      changed_when: false
      loop: "{{ xvpn_verify_label_paths }}"
      loop_control:
        loop_var: xvpn_label_rel
        label: "{{ xvpn_label_rel }}"

    - name: Read the policy context of each D-08 container path under the real home root
      ansible.builtin.command:
        argv: >-
          {{ ['matchpathcon', '-n', xvpn_verify_rt_home ~ '/' ~ xvpn_label_rel]
             if xvpn_verify_rt_lookup_tool.stdout | trim == 'matchpathcon'
             else ['selabel_lookup', '-b', 'file', '-k', xvpn_verify_rt_home ~ '/' ~ xvpn_label_rel] }}
      register: xvpn_verify_rt_own
      changed_when: false
      failed_when: false
      loop: "{{ xvpn_verify_label_paths }}"
      loop_control:
        loop_var: xvpn_label_rel
        label: "{{ xvpn_label_rel }}"

    - name: Assert each D-08 container path carries the type the policy assigns to its /home twin
      ansible.builtin.assert:
        that:
          - xvpn_verify_rt_actual.results[xvpn_label_idx].stdout | trim | length > 0
          - xvpn_verify_rt_twin.results[xvpn_label_idx].stdout | trim | length > 0
          - xvpn_verify_rt_actual_type == xvpn_verify_rt_twin_type
          - xvpn_verify_rt_actual_type not in ['var_lib_t', 'default_t', 'unlabeled_t']
        fail_msg: >-
          D-08 label mismatch for {{ xvpn_label_rel }}: on-disk {{ xvpn_verify_rt_actual.results[xvpn_label_idx].stdout | trim }};
          /home twin (policy) {{ xvpn_verify_rt_twin.results[xvpn_label_idx].stdout | trim }};
          real path (policy, via matchpathcon -n) {{ xvpn_verify_rt_own.results[xvpn_label_idx].stdout | default('') | trim }}.
          Equal policy values but a different on-disk type mean the labels were not applied; a differing policy value means
          the /home equivalence does not reach the path.
        quiet: true
      vars:
        xvpn_verify_rt_actual_type: "{{ (xvpn_verify_rt_actual.results[xvpn_label_idx].stdout | trim).split(':')[2] | default('') }}"
        xvpn_verify_rt_twin_ctx: >-
          {{ xvpn_verify_rt_twin.results[xvpn_label_idx].stdout
             | regex_search('[A-Za-z0-9_]+:object_r:[A-Za-z0-9_]+:[^\s]*') | default('', true) }}
        xvpn_verify_rt_twin_type: "{{ xvpn_verify_rt_twin_ctx.split(':')[2] | default('') }}"
      loop: "{{ xvpn_verify_label_paths }}"
      loop_control:
        loop_var: xvpn_label_rel
        index_var: xvpn_label_idx
        label: "{{ xvpn_label_rel }}"

    - name: Report the observed D-08 label types
      ansible.builtin.debug:
        msg: >-
          D-08 {{ xvpn_label_rel }}: on-disk {{ xvpn_verify_rt_actual.results[xvpn_label_idx].stdout | trim }};
          /home twin {{ xvpn_verify_rt_twin.results[xvpn_label_idx].stdout | trim }}
      loop: "{{ xvpn_verify_label_paths }}"
      loop_control:
        loop_var: xvpn_label_rel
        index_var: xvpn_label_idx
        label: "{{ xvpn_label_rel }}"

- name: Check that the network is online
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - network-online.target
  register: xvpn_verify_rt_netonline
  changed_when: false

- name: Assert network-online.target is active
  ansible.builtin.assert:
    that:
      - xvpn_verify_rt_netonline.stdout | trim == 'active'
    quiet: true

- name: Read the unit definition from the user manager
  ansible.builtin.command:
    argv:
      - systemctl
      - --user
      - cat
      - "{{ xvpn_verify_rt_unit }}"
  become: true
  become_user: "{{ xvpn_verify_rt_user }}"
  become_method: ansible.builtin.sudo
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ xvpn_verify_rt_uid }}"
  register: xvpn_verify_rt_unit_cat
  changed_when: false

- name: Assert the unit waits for the network-online helper
  ansible.builtin.assert:
    that:
      - xvpn_verify_rt_unit_cat.stdout is search('podman-user-wait-network-online.service')
    fail_msg: "{{ xvpn_verify_rt_unit }} is not ordered after podman-user-wait-network-online.service"
    quiet: true

- name: Read the linger state
  ansible.builtin.command:
    argv:
      - loginctl
      - show-user
      - "{{ xvpn_verify_rt_user }}"
      - --property=Linger
  register: xvpn_verify_rt_linger
  changed_when: false

- name: Assert linger is enabled
  ansible.builtin.assert:
    that:
      - xvpn_verify_rt_linger.stdout | trim == 'Linger=yes'
    quiet: true

# B-2: dontaudit state at the moment of the check. Nothing here re-disables it: a 0 now proves it stayed off
# for the whole window since the marker, and a rebuilt policy that re-enabled it must fail loudly.
- name: Read the loaded policy statistics at check time
  ansible.builtin.command: seinfo
  register: xvpn_verify_rt_seinfo
  changed_when: false

- name: Find the binary policy files
  ansible.builtin.find:
    paths: /etc/selinux/targeted/policy
    patterns: "policy.*"
  register: xvpn_verify_rt_policy_files

- name: Checksum the newest binary policy file
  ansible.builtin.stat:
    path: "{{ (xvpn_verify_rt_policy_files.files | sort(attribute='mtime') | last).path }}"
    checksum_algorithm: sha256
  register: xvpn_verify_rt_policy_stat
  when: xvpn_verify_rt_policy_files.files | length > 0

- name: Assert no dontaudit rules are loaded
  ansible.builtin.assert:
    that:
      - xvpn_verify_rt_seinfo.stdout is regex('(?m)(?:^|\s)Dontaudit:\s+[0-9]+')
      - (xvpn_verify_rt_seinfo.stdout | regex_findall('(?m)(?:^|\s)Dontaudit:\s+([0-9]+)') | first | int) == 0
    fail_msg: |-
      dontaudit rules are loaded at AVC-check time; denials since the marker may be hidden (policy rebuilt during converge?)
      {{ xvpn_verify_rt_seinfo.stdout }}
      policy file: {{ xvpn_verify_rt_policy_stat.stat.path | default('none') }} sha256 {{ xvpn_verify_rt_policy_stat.stat.checksum | default('none') }}
    quiet: true

- name: Read the AVC marker
  ansible.builtin.slurp:
    src: /var/lib/xvpn-molecule/avc_marker
  register: xvpn_verify_rt_marker

- name: Search the audit log for denials since the marker
  ansible.builtin.command:
    argv:
      - ausearch
      - -m
      - AVC,USER_AVC,SELINUX_ERR,USER_SELINUX_ERR
      - -ts
      - "{{ (xvpn_verify_rt_marker.content | b64decode | trim).split()[0] }}"
      - "{{ (xvpn_verify_rt_marker.content | b64decode | trim).split()[1] }}"
  environment:
    LC_ALL: C
  register: xvpn_verify_rt_avc
  changed_when: false
  failed_when: false

- name: Collect the raw denial records for diagnostics
  ansible.builtin.command:
    argv:
      - ausearch
      - -m
      - AVC,USER_AVC,SELINUX_ERR,USER_SELINUX_ERR
      - -ts
      - "{{ (xvpn_verify_rt_marker.content | b64decode | trim).split()[0] }}"
      - "{{ (xvpn_verify_rt_marker.content | b64decode | trim).split()[1] }}"
      - --raw
  environment:
    LC_ALL: C
  register: xvpn_verify_rt_avc_raw
  changed_when: false
  failed_when: false

- name: Explain the denials
  ansible.builtin.command:
    argv:
      - audit2why
    stdin: "{{ xvpn_verify_rt_avc_raw.stdout }}"
  register: xvpn_verify_rt_avc_why
  changed_when: false
  failed_when: false

- name: Assert zero AVC denials since the marker
  ansible.builtin.assert:
    that:
      - xvpn_verify_rt_avc.rc == 1
      - xvpn_verify_rt_avc.stderr is search('<no matches>')
    fail_msg: |-
      SELinux denials since the marker (rc={{ xvpn_verify_rt_avc.rc }}); do not add booleans or rules, escalate with this evidence.
      raw records:
      {{ xvpn_verify_rt_avc_raw.stdout }}
      audit2why:
      {{ xvpn_verify_rt_avc_why.stdout | default('') }}{{ xvpn_verify_rt_avc_why.stderr | default('') }}
      ausearch stderr: {{ xvpn_verify_rt_avc.stderr }}
    quiet: true
