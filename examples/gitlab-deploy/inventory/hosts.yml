---
# Replace every example value. Placeholder domains such as example.com are rejected by the
# role on purpose. Both A records must point to the host before the first run (HTTP-01 on :80).
all:
  children:
    remnawave_panel:
      hosts:
        panel1:
          ansible_host: 203.0.113.10
          ansible_user: deploy
      vars:
        xvpn_panel_domain: panel.example.com
        xvpn_subscription_domain: sub.example.com
        xvpn_edge_acme_email: admin@example.com
        # staging gives untrusted test certificates and avoids Let's Encrypt rate limits;
        # switch to production once the run is green.
        xvpn_edge_acme_ca: staging
