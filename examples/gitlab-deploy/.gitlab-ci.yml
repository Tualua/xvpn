---
# Minimal GitLab pipeline that deploys the Remnawave Panel host with xvpn.remnawave.
# Copy this directory into a PRIVATE GitLab project: the inventory names real hosts.
#
# One-time setup in that project:
#   git submodule add https://github.com/Tualua/xvpn.git vendor/xvpn
#   git -C vendor/xvpn checkout <tag or commit>   # the deployed collection version
#   git commit -am "Pin xvpn.remnawave"
#
# CI/CD variables (Settings > CI/CD > Variables), all Protected:
#   SSH_PRIVATE_KEY   type File   - key of the deploy user on the Panel host (sudo without password)
#   SSH_KNOWN_HOSTS   type File   - output of `ssh-keyscan -t ed25519 <panel-host>`
#   ANSIBLE_VAULT_PASSWORD  type File, optional - only if group_vars hold ansible-vault values
#
# The image is the community execution environment with ansible-core only: it has ssh
# but no git, so the collection comes from the submodule that the runner checks out.

stages:
  - check
  - deploy

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  ANSIBLE_FORCE_COLOR: "true"
  ANSIBLE_HOST_KEY_CHECKING: "true"
  ANSIBLE_INVENTORY: "inventory/hosts.yml"
  ANSIBLE_COLLECTIONS_PATH: "$CI_PROJECT_DIR/.collections"

default:
  image: ghcr.io/ansible-community/community-ee-minimal:2.21.6-1
  before_script:
    - ansible-galaxy collection install -r requirements.yml -p "$ANSIBLE_COLLECTIONS_PATH"
    - export SSH_DIR="$(mktemp -d)"
    - install -m 0600 "$SSH_PRIVATE_KEY" "$SSH_DIR/id_deploy"
    - export ANSIBLE_PRIVATE_KEY_FILE="$SSH_DIR/id_deploy"
    - export ANSIBLE_SSH_COMMON_ARGS="-o UserKnownHostsFile=$SSH_KNOWN_HOSTS"
    - >-
      if [ -n "${ANSIBLE_VAULT_PASSWORD:-}" ]; then
      export ANSIBLE_VAULT_PASSWORD_FILE="$ANSIBLE_VAULT_PASSWORD"; fi

check-connection:
  stage: check
  script:
    - ansible-playbook xvpn.remnawave.panel --syntax-check
    - ansible -m ansible.builtin.ping remnawave_panel

deploy-panel:
  stage: deploy
  resource_group: remnawave-panel
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    - ansible-playbook xvpn.remnawave.panel
