---
# Minimal GitLab pipeline that deploys the Remnawave Panel host with xvpn.remnawave.
# Copy this directory into a PRIVATE GitLab project: the inventory names real hosts.
#
# CI/CD variables (Settings > CI/CD > Variables), all Protected:
#   SSH_PRIVATE_KEY   type File   - key of the deploy user on the Panel host (sudo without password)
#   SSH_KNOWN_HOSTS   type File   - output of `ssh-keyscan -t ed25519 <panel-host>`
#   ANSIBLE_VAULT_PASSWORD  type File, optional - only if group_vars hold ansible-vault values
#
# The deploy job is manual and runs only on the default branch; resource_group keeps
# two deploys from running against the host at the same time.

stages:
  - check
  - deploy

default:
  image: docker.io/library/python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends openssh-client git >/dev/null
    - pip install --quiet --no-cache-dir "ansible-core>=2.21,<2.22"
    - ansible-galaxy collection install -r requirements.yml
    - install -d -m 0700 ~/.ssh
    - install -m 0600 "$SSH_PRIVATE_KEY" ~/.ssh/id_deploy
    - install -m 0644 "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - >-
      if [ -n "${ANSIBLE_VAULT_PASSWORD:-}" ]; then
      export ANSIBLE_VAULT_PASSWORD_FILE="$ANSIBLE_VAULT_PASSWORD"; fi

variables:
  ANSIBLE_FORCE_COLOR: "true"
  ANSIBLE_HOST_KEY_CHECKING: "true"
  ANSIBLE_PRIVATE_KEY_FILE: "~/.ssh/id_deploy"
  ANSIBLE_INVENTORY: "inventory/hosts.yml"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

check-connection:
  stage: check
  script:
    - ansible-playbook xvpn.remnawave.panel --syntax-check
    - ansible -m ansible.builtin.ping remnawave_panel

deploy-panel:
  stage: deploy
  resource_group: remnawave-panel
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    - ansible-playbook xvpn.remnawave.panel
