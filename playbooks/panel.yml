---
- name: Panel preflight (read-only)
  hosts: "{{ xvpn_panel_hosts_group | default('remnawave_panel') }}"
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [preflight]
  vars:
    # D-12: the subscription page has its own domain, checked together with the Panel domain
    xvpn_preflight_domains: >-
      {{ [xvpn_panel_domain]
         + ([xvpn_subscription_domain | default('')] if (xvpn_panel_subscription_enabled | default(true) | bool) else []) }}
  pre_tasks:
    - name: Require the Panel domain before any check
      ansible.builtin.assert:
        that:
          - xvpn_panel_domain | default('') | length > 0
        fail_msg: "xvpn_panel_domain is required: set the Panel FQDN in the inventory"
        quiet: true

    - name: Require the subscription domain while the subscription page is enabled
      ansible.builtin.assert:
        that:
          - xvpn_subscription_domain | default('') | length > 0
        fail_msg: "xvpn_subscription_domain is required while the subscription page is enabled: set it in the inventory"
        quiet: true
      when: xvpn_panel_subscription_enabled | default(true) | bool
  roles:
    - xvpn.remnawave.preflight

- name: Panel host
  hosts: "{{ xvpn_panel_hosts_group | default('remnawave_panel') }}"
  become: true
  gather_facts: true
  vars:
    xvpn_common_firewall_ports: ["80/tcp", "443/tcp"]
    xvpn_podman_rootless_users:
      - name: rw-edge
      - name: rw-panel
  roles:
    - xvpn.remnawave.common
    - xvpn.remnawave.podman_rootless
    - xvpn.remnawave.edge
    - xvpn.remnawave.panel
